# nxtrace_dap.cfg -- configure the STM32H743 parallel ETM + DWT thread-switch
# trace entirely from the debugger (DAP), so the target RTOS (NuttX) needs ZERO
# trace/register bring-up code.
#
# WHY THIS WORKS (doc 01 §4.3 + AGENT.md gotchas 29/30/32):
#   - NuttX's arm_enable_dbgmonitor() clears all DWT comparators at boot, BUT it
#     returns early if DHCSR.C_DEBUGEN is set (a debugger is attached). So as long
#     as the DAP stays connected, NuttX never clears our DWT config -- no target
#     re-arm needed. This is exactly the TRACE32/J-Trace "probe always attached"
#     model.
#   - The CoreSight blocks (ETM/CSTF/ETF/TPIU/TSGEN) and GPIOE live in memory the
#     DAP can mww directly, so the whole path is configured host-side.
#
# USAGE (keep openocd RESIDENT so C_DEBUGEN stays 1):
#   G=$(arm-none-eabi-nm nuttx | awk '$3=="g_running_tasks"{print "0x"$1}')
#   openocd -f interface/cmsis-dap.cfg -f target/stm32h7x.cfg \
#           -f nxtrace_dap.cfg -c "nxtrace_arm $G" -c "nxtrace_run"
#   # openocd now stays attached (nxtrace_run keeps the session open); grab in
#   # another shell. Do NOT let this openocd exit -- C_DEBUGEN drops and NuttX's
#   # next debug-monitor path (or a fresh connect) clears the DWT.
#
# All register addresses/bits: RM0433 §60 / DDI0494D (see etm_regs.h / doc 01).

# ---- CoreSight component addresses (H743) ---------------------------------
set NX_CS_UNLOCK   0xC5ACCE55

set NX_DEMCR       0xE000EDFC
set NX_DBGMCU_CR   0x5C001004

set NX_TSGEN_CNTCR 0x5C005000

set NX_TPIU        0x5C015000
set NX_CSTF        0x5C013000
set NX_ETF         0x5C014000
set NX_ETM         0xE0041000

set NX_DWT         0xE0001000
set NX_ITM         0xE0000000

# GPIOE (PE2..PE6 = TRACECK/TRACED0..3), RCC AHB4ENR
set NX_RCC_AHB4ENR 0x580244E0
set NX_GPIOE_MODER   0x58021000
set NX_GPIOE_OTYPER  0x58021004
set NX_GPIOE_OSPEEDR 0x58021008
set NX_GPIOE_AFRL    0x58021020

# SYSCFG I/O compensation cell (RCC APB4ENR.SYSCFGEN + SYSCFG_CCCSR). On H7,
# VERY_HIGH-speed pads only reach rated slew with the compensation cell ON;
# without it PE5/PE6 (TRACED2/3) rise too slowly -> the high data-nibble bits
# never reach full swing (symptom: D3 swing < CLK, 0xFF never appears, deframer
# can't lock). See AGENT.md / etm_selftrace.c.
set NX_RCC_APB4ENR  0x580244F4
set NX_SYSCFG_CCCSR 0x58000420

# ---- helpers --------------------------------------------------------------
# write-32 then unlock helper (LAR at base+0xFB0)
proc nx_unlock {base} {
    global NX_CS_UNLOCK
    mww [expr {$base + 0xFB0}] $NX_CS_UNLOCK
}

# ---- per-block bring-up procs ---------------------------------------------
proc nxtrace_gpio {} {
    global NX_RCC_AHB4ENR NX_GPIOE_MODER NX_GPIOE_OTYPER NX_GPIOE_OSPEEDR NX_GPIOE_AFRL
    global NX_RCC_APB4ENR NX_SYSCFG_CCCSR
    # SYSCFG I/O compensation cell first (VERY_HIGH pads need it for rated slew):
    # RCC APB4ENR.SYSCFGEN (bit1), then SYSCFG_CCCSR.EN (bit0), wait READY (bit8).
    mmw $NX_RCC_APB4ENR 0x00000002 0
    mmw $NX_SYSCFG_CCCSR 0x00000001 0
    for {set i 0} {$i < 1000} {incr i} {
        if {[expr {[mrw $NX_SYSCFG_CCCSR] & 0x100}]} break
    }
    # RCC.GPIOEEN (bit4)
    mmw $NX_RCC_AHB4ENR 0x00000010 0
    # PE2..PE6 -> AF mode (10) : MODER bits [13:4] = 5x '10' = 0x2AA0
    # (was 0x0AA0 -- only 4 pins; PE6/TRACED3 stayed INPUT -> D3 never driven)
    mmw $NX_GPIOE_MODER 0x00002AA0 0x00003FF0
    # PE2..PE6 -> push-pull : OTYPER bits [6:2] = 0
    mmw $NX_GPIOE_OTYPER 0 0x0000007C
    # PE2..PE6 -> very-high speed (11) : OSPEEDR bits [13:4]
    mmw $NX_GPIOE_OSPEEDR 0x00003FF0 0
    # PE2..PE6 -> AF0 (TRACE) : AFRL nibbles [27:8] = 0
    mmw $NX_GPIOE_AFRL 0 0x0FFFFF00
}

proc nxtrace_clocks {} {
    global NX_DEMCR NX_DBGMCU_CR NX_TSGEN_CNTCR
    # DEMCR.TRCENA (bit24)
    mmw $NX_DEMCR 0x01000000 0
    # DBGMCU_CR: TRACECLKEN|D1DBGCKEN|D3DBGCKEN (bits 20/21/22)
    mmw $NX_DBGMCU_CR 0x00700000 0
    # TSGEN CNTCR.EN (bit0) -- else ETM timestamps read 0
    mmw $NX_TSGEN_CNTCR 0x00000001 0
}

# TPIU port width: default 4-bit. Override before nxtrace_arm with
# `nxtrace_set_width 2` (or 1) to try a narrower port (fewer TRACED lines ->
# less crosstalk -> TRACECLK headroom). CURPSIZE = 1<<(W-1): 4->0x08, 2->0x02,
# 1->0x01. The FPGA side must match (trace_ctrl.py set-width W) and the host
# decode must pass --trace-width W.
set NX_TRACE_WIDTH 4

proc nxtrace_set_width {w} {
    global NX_TRACE_WIDTH
    set NX_TRACE_WIDTH $w
}

proc nxtrace_tpiu {} {
    global NX_TPIU NX_TRACE_WIDTH
    nx_unlock $NX_TPIU
    set curpsize [expr {1 << ($NX_TRACE_WIDTH - 1)}]
    mww [expr {$NX_TPIU + 0x004}] $curpsize ;# CURPSIZE = 1<<(W-1)
    mww [expr {$NX_TPIU + 0x0F0}] 0x00000000 ;# SPPR = parallel
    mww [expr {$NX_TPIU + 0x304}] 0x00000102 ;# FFCR = EnFCont|EnFTC
}

proc nxtrace_funnel {} {
    global NX_CSTF
    nx_unlock $NX_CSTF
    # CTRL: ENS0(ETM)|ENS1(ITM/DWT)
    mww [expr {$NX_CSTF + 0x000}] 0x00000303
    # PRIORITY: keep reserved bits, set PRIPORT1(ITM)=0 (high), PRIPORT0(ETM)=1
    mmw [expr {$NX_CSTF + 0x004}] 0x00000001 0x0000003F
}

proc nxtrace_etf {} {
    global NX_ETF
    mww [expr {$NX_ETF + 0x020}] 0x00000000 ;# CTL: disable to program
    nx_unlock $NX_ETF
    mww [expr {$NX_ETF + 0x028}] 0x00000002 ;# MODE = hardware FIFO
    mww [expr {$NX_ETF + 0x304}] 0x00000001 ;# FFCR = EnFt
    mww [expr {$NX_ETF + 0x020}] 0x00000001 ;# CTL: TraceCaptEn
}

proc nxtrace_etm {} {
    global NX_ETM
    nx_unlock $NX_ETM
    mww [expr {$NX_ETM + 0x310}] 0x00000008 ;# TRCPDCR.PU (power up)
    mww [expr {$NX_ETM + 0x004}] 0x00000000 ;# TRCPRGCTLR: disable to program
    # wait for TRCSTATR.IDLE (bit0)
    for {set i 0} {$i < 100} {incr i} {
        if {[expr {[mrw [expr {$NX_ETM + 0x00C}]] & 1}]} break
    }
    # TRCCONFIGR: TS(bit11)|CCI(bit4), NO BB (bandwidth) -> execution time base
    mww [expr {$NX_ETM + 0x010}] 0x00000810
    mww [expr {$NX_ETM + 0x040}] 0x00000002 ;# TRCTRACEIDR = 2 (ETM stream)
    mww [expr {$NX_ETM + 0x038}] 0x00000010 ;# TRCCCCTLR threshold (>= CCITMIN)
    mww [expr {$NX_ETM + 0x02C}] 0x00000100 ;# TRCSTALLCTLR = ISTALL only (LEVEL=0!)
    mww [expr {$NX_ETM + 0x080}] 0x00000201 ;# TRCVICTLR = trace all
    mww [expr {$NX_ETM + 0x034}] 0x0000000C ;# TRCSYNCPR = 4K
    mww [expr {$NX_ETM + 0x030}] 0x00000000 ;# TRCTSCTLR = 0 (implicit TS)
    mww [expr {$NX_ETM + 0x004}] 0x00000001 ;# TRCPRGCTLR: enable
}

# nxtrace_dwt <g_running_tasks_addr> : arm DWT comparator 0 to emit a data-value
# packet on every WRITE to the current-task pointer (= each thread switch).
proc nxtrace_dwt {watch_addr} {
    global NX_DWT NX_ITM NX_CS_UNLOCK
    # ITM: unlock, all ports, ITMENA|TSENA|SYNCENA|TXENA, ATB ID 1
    mww [expr {$NX_ITM + 0xFB0}] $NX_CS_UNLOCK
    mww [expr {$NX_ITM + 0xE40}] 0x00000000 ;# TPR
    mww [expr {$NX_ITM + 0xE00}] 0xFFFFFFFF ;# TER
    mww [expr {$NX_ITM + 0xE80}] 0x0001000F ;# TCR: ITMENA|TSENA|SYNCENA|TXENA|ID1
    # DWT: cycle counter on + comparator 0 = data-value on write (FUNCTION 0x0D)
    mww [expr {$NX_DWT + 0x004}] 0x00000000 ;# CYCCNT = 0
    mww [expr {$NX_DWT + 0x000}] 0x40000001 ;# CTRL: CYCCNTENA
    mww [expr {$NX_DWT + 0x028}] 0x00000000 ;# FUNCTION0: disable while programming
    mww [expr {$NX_DWT + 0x020}] $watch_addr ;# COMP0 = &g_running_tasks
    mww [expr {$NX_DWT + 0x024}] 0x00000000 ;# MASK0 = 0 (exact)
    mww [expr {$NX_DWT + 0x028}] 0x0000000D ;# FUNCTION0 = data-value on write
}

# ---- top-level: halt, configure everything, resume ------------------------
proc nxtrace_arm {watch_addr} {
    halt
    nxtrace_gpio
    nxtrace_clocks
    nxtrace_tpiu
    nxtrace_funnel
    nxtrace_etf
    nxtrace_etm
    nxtrace_dwt $watch_addr
    echo [format "nxtrace_dap: armed; DWT COMP0=0x%08x FUNC0=0x%08x ITM_TCR=0x%08x" \
        [mrw 0xE0001020] [mrw 0xE0001028] [mrw 0xE0000E80]]
    resume
}

# Keep the session attached so C_DEBUGEN stays 1 (NuttX won't clear the DWT).
# Openocd stays in its event loop until killed; grab in another shell.
proc nxtrace_run {} {
    echo "nxtrace_dap: openocd staying attached (C_DEBUGEN held). Ctrl-C to stop."
    # nothing to do; returning keeps openocd's server running (no shutdown).
}
