# Change PLL1 DIVR1 (TRACECLK divider) at runtime with the CPU HALTED, then
# re-enable CURTPM. RM0433 §8.5.5: DIVR1 writable only when PLL1 disabled, and
# PLL1 can't be disabled while it clocks sys_ck -> switch sys_ck to HSI first.
# With the CPU halted, firmware won't fight the RCC changes.
#
# DIVR1 field via env DIVR1_VAL (0 => VCO/1, 1 => VCO/2, 2 => VCO/3, ...).
init
halt

set nv 0
if {[info exists ::env(DIVR1_VAL)]} { set nv $::env(DIVR1_VAL) }

# 1) sys_ck -> HSI
mww 0x58024410 [expr {[mrw 0x58024410] & ~0x7}]
set to 0
while {([mrw 0x58024410] & 0x38) != 0} { if {[incr to] > 100000} break }

# 2) disable PLL1
mww 0x58024400 [expr {[mrw 0x58024400] & ~0x01000000}]
set to 0
while {([mrw 0x58024400] & 0x02000000) != 0} { if {[incr to] > 100000} break }

# 3) patch DIVR1 field bits[30:24]
set divr [mrw 0x58024430]
set divr [expr {$divr & ~(0x7F << 24)}]
set divr [expr {$divr | ($nv << 24)}]
mww 0x58024430 $divr

# 4) re-enable PLL1
mww 0x58024400 [expr {[mrw 0x58024400] | 0x01000000}]
set to 0
while {([mrw 0x58024400] & 0x02000000) == 0} { if {[incr to] > 100000} break }

# 5) sys_ck -> PLL1
mww 0x58024410 [expr {([mrw 0x58024410] & ~0x7) | 0x3}]

echo "DIVR1 set to field=$nv"
echo "RCC_PLL1DIVR = [format 0x%08x [mrw 0x58024430]]"
echo "RCC_CR       = [format 0x%08x [mrw 0x58024400]]"

# ---- re-arm CURTPM AA/55 (PLL1 restart may have nudged TPIU) ----
mww 0x580244E0 [expr {[mrw 0x580244E0] | 0x10}]
set m [mrw 0x58021000]
set m [expr {$m & ~(0x3FFF << 4)}]
set m [expr {$m | (0x2 << 4) | (0x2 << 6) | (0x2 << 8) | (0x2 << 10) | (0x2 << 12)}]
mww 0x58021000 $m
set s [mrw 0x58021008]
set s [expr {$s & ~(0x3FF << 4)}]
set s [expr {$s | (0x3 << 4) | (0x3 << 6) | (0x3 << 8) | (0x3 << 10) | (0x3 << 12)}]
mww 0x58021008 $s
mww 0x58021004 [expr {[mrw 0x58021004] & ~(0x7C)}]
set afrl [mrw 0x58021020]
set afrl [expr {$afrl & ~(0xFFFFF << 8)}]
mww 0x58021020 $afrl
mww 0xE000EDFC 0x01000000
mww 0x5C001004 [expr {[mrw 0x5C001004] | 0x00700000}]
mww 0x5C015FB0 0xC5ACCE55
mww 0x5C015004 0x00000008
mww 0x5C0150F0 0x00000000
mww 0x5C015304 0x00000102
mww 0x5C015204 0x00020004
echo "CURTPM re-armed AA/55; TPIU_CURTPM=[format 0x%08x [mrw 0x5C015204]]"
shutdown
