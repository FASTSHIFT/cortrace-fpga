# OpenOCD: cleanly shut down the H743 trace subsystem so the debug AP does not
# stay busy (which makes the next SWD connect stall with "stalled AP operation").
# Disables ETM, drains/disables the ETF, clears CURTPM, and gates off the
# DBGMCU trace clocks. Run this after a capture, before power-off or reconnect.

init
halt

# ETM: unlock, disable (TRCPRGCTLR.EN=0)
mww 0xE0041FB0 0xC5ACCE55
mww 0xE0041004 0x00000000

# ETF: unlock, disable trace capture (TMC CTL bit0=0)
mww 0x5C014FB0 0xC5ACCE55
mww 0x5C014020 0x00000000

# TPIU: clear the test-pattern generator
mww 0x5C015FB0 0xC5ACCE55
mww 0x5C015204 0x00000000

# DBGMCU_CR: gate OFF trace clocks (clear bits 20/21/22)
mww 0x5C001004 [expr {[mrw 0x5C001004] & ~0x00700000}]

echo "TRCPRGCTLR=[format 0x%08x [mrw 0xE0041004]]  ETF_CTL=[format 0x%08x [mrw 0x5C014020]]  DBGMCU=[format 0x%08x [mrw 0x5C001004]]"
resume
shutdown
