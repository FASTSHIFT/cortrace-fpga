# Set PLL1 DIVN1 (VCO multiplier) at runtime, CPU halted, DIVR1=0 (VCO/1) so
# TRACECLK = VCO = ref * N. Lets us sweep TRACECLK by stepping N without
# reflashing firmware. Then re-arm CURTPM AA/55.
#
# DIVN1 field via env PLLN_VAL (actual N = field+1). e.g. field=23 -> N=24.
# Keeps DIVP1/DIVQ1 as-is; forces DIVR1 field=0 (TRACECLK = full VCO).
#
# NB: sys_ck = pll1_p_ck = VCO/DIVP1 also scales with N. CPU is halted so this
# is harmless for CURTPM pattern gen (TPIU is clocked off pll1 too but only
# needs to toggle). Watch VCO stays in range (H743 wide VCO 192-836 MHz for
# this M/ref; medium 150-420). We keep VCO modest.
init
halt

set nf 23
if {[info exists ::env(PLLN_VAL)]} { set nf $::env(PLLN_VAL) }

# sys_ck -> HSI
mww 0x58024410 [expr {[mrw 0x58024410] & ~0x7}]
set to 0
while {([mrw 0x58024410] & 0x38) != 0} { if {[incr to] > 100000} break }
# disable PLL1
mww 0x58024400 [expr {[mrw 0x58024400] & ~0x01000000}]
set to 0
while {([mrw 0x58024400] & 0x02000000) != 0} { if {[incr to] > 100000} break }
# patch DIVN1 (bits[8:0]) and force DIVR1 field=0 (bits[30:24])
set divr [mrw 0x58024430]
set divr [expr {$divr & ~0x1FF}]
set divr [expr {$divr | ($nf & 0x1FF)}]
set divr [expr {$divr & ~(0x7F << 24)}]
mww 0x58024430 $divr
# re-enable PLL1
mww 0x58024400 [expr {[mrw 0x58024400] | 0x01000000}]
set to 0
while {([mrw 0x58024400] & 0x02000000) == 0} { if {[incr to] > 200000} break }
# sys_ck -> PLL1
mww 0x58024410 [expr {([mrw 0x58024410] & ~0x7) | 0x3}]

echo "PLLN field=$nf (N=[expr {$nf+1}])  PLL1DIVR=[format 0x%08x [mrw 0x58024430]]  CR=[format 0x%08x [mrw 0x58024400]]"

# re-arm CURTPM AA/55
mww 0x580244E0 [expr {[mrw 0x580244E0] | 0x10}]
set m [mrw 0x58021000]
set m [expr {$m & ~(0x3FFF << 4)}]
set m [expr {$m | (0x2 << 4) | (0x2 << 6) | (0x2 << 8) | (0x2 << 10) | (0x2 << 12)}]
mww 0x58021000 $m
set s [mrw 0x58021008]
set s [expr {$s & ~(0x3FF << 4)}]
set s [expr {$s | (0x3 << 4) | (0x3 << 6) | (0x3 << 8) | (0x3 << 10) | (0x3 << 12)}]
mww 0x58021008 $s
mww 0x58021004 [expr {[mrw 0x58021004] & ~(0x7C)}]
set afrl [mrw 0x58021020]
set afrl [expr {$afrl & ~(0xFFFFF << 8)}]
mww 0x58021020 $afrl
mww 0xE000EDFC 0x01000000
mww 0x5C001004 [expr {[mrw 0x5C001004] | 0x00700000}]
mww 0x5C015FB0 0xC5ACCE55
mww 0x5C015004 0x00000008
mww 0x5C0150F0 0x00000000
mww 0x5C015304 0x00000102
set curtpm 0x00020004
if {[info exists ::env(CURTPM_VAL)]} { set curtpm $::env(CURTPM_VAL) }
mww 0x5C015204 $curtpm
echo "CURTPM re-armed = [format 0x%08x [mrw 0x5C015204]]"
shutdown
