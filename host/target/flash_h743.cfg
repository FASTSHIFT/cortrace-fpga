# OpenOCD: flash a H743_Blink firmware image into STM32H743 internal flash via
# the DAPLink (CMSIS-DAP). Pass the hex path via env FW_HEX.
#
#   FW_HEX=/path/H743_Blink.hex openocd -f interface/cmsis-dap.cfg \
#       -f target/stm32h7x.cfg -f syn/artix7/bringup/target/flash_h743.cfg
#
# H743 has 2 MB flash across two banks starting at 0x08000000. program+verify
# then reset-run so the fresh firmware boots and starts emitting on the TPIU
# once ETM is enabled (etm_enable_h743.cfg).

init
reset halt

set fw "H743_Blink.hex"
if {[info exists ::env(FW_HEX)]} { set fw $::env(FW_HEX) }

program $fw verify reset
echo "==> flashed $fw, target reset+running"
shutdown
