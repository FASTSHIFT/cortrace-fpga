# OpenOCD: STM32H743 TPIU test-pattern generator -- 4-bit parallel datapath
# validation WITHOUT the ETM. Drives a known pattern on TRACECK + all 4 data
# lanes (TRACED0..3 = PE3..6) so a logic analyser / FPGA capture can prove the
# pin mux + wiring + FPGA sampling front-end independently of how much trace
# the CPU actually generates. Used to confirm PE4/PE5 (TRACED1/2) were fine
# when they looked "stuck" under low ETM traffic (they weren't stuck -- the ETM
# just wasn't toggling those lanes). See etm_enable_h743.cfg for the real trace.
#
# TPIU is on the D-domain APB-D bus: access at system-bus 0x5C015000 (the
# 0xE00F5000 debugger alias reads 0 from OpenOCD's MEM-AP).
#   SUPTPM (+0x200, RO) = 0x000300FF : PATW1/PATW0/PATA5/PATF0 + PCONT/PTIME
#   CURTPM (+0x204)     : bit0 PATW1(walking-1s) bit1 PATW0(walking-0s)
#                         bit2 PATA5(AA/55) bit3 PATF0(FF/00)
#                         bit16 PTIMEEN bit17 PCONTEN(continuous)
#   -> 0x00020004 = AA/55 continuous : every lane toggles each TRACECK edge.
#
# Run (this H743 uses a DAPLink, not ST-Link):
#   openocd -f interface/cmsis-dap.cfg -f target/stm32h7x.cfg \
#           -f syn/artix7/bringup/target/tpiu_testpattern_h743.cfg

init
reset halt

# GPIOE PE2..PE6 -> AF0 (trace), very high speed, push-pull (same as trace cfg).
mww 0x580244E0 [expr {[mrw 0x580244E0] | 0x00000010}]
set moder [mrw 0x58021000]
set moder [expr {$moder & ~(0x3FFF << 4)}]
set moder [expr {$moder | (0x2 << 4) | (0x2 << 6) | (0x2 << 8) | (0x2 << 10) | (0x2 << 12)}]
mww 0x58021000 $moder
set ospeedr [mrw 0x58021008]
set ospeedr [expr {$ospeedr | (0x3 << 4) | (0x3 << 6) | (0x3 << 8) | (0x3 << 10) | (0x3 << 12)}]
mww 0x58021008 $ospeedr
mww 0x58021004 [expr {[mrw 0x58021004] & ~(0x7C)}]
set afrl [mrw 0x58021020]
set afrl [expr {$afrl & ~(0xFFFFF << 8)}]
mww 0x58021020 $afrl

# Trace power/clocks on: DEMCR.TRCENA + DBGMCU_CR TRACECLKEN/D1/D3.
mww 0xE000EDFC 0x01000000
mww 0x5C001004 [expr {[mrw 0x5C001004] | 0x00700000}]

# TPIU: 4-bit parallel, continuous formatting.
mww 0x5C015004 0x00000008
mww 0x5C0150F0 0x00000000
mww 0x5C015304 0x00000102

# Enable the continuous AA/55 test pattern on all 4 data lanes.
mww 0x5C015204 0x00020004

echo "==================== READBACK ===================="
echo "TPIU_SUPTPM   = [format 0x%08x [mrw 0x5C015200]]  (supported patterns/modes)"
echo "TPIU_CURTPM   = [format 0x%08x [mrw 0x5C015204]]  (expect 0x00020004 = AA/55 continuous)"
echo "TPIU_CURPSIZE = [format 0x%08x [mrw 0x5C015004]]  (expect 0x08 = 4-bit)"
echo "DBGMCU_CR     = [format 0x%08x [mrw 0x5C001004]]  (expect bits 20/21/22 set)"

resume

echo "==================================================================="
echo " TPIU AA/55 test pattern running on TRACECK(PE2) + TRACED0..3(PE3..6)."
echo " All 4 data lanes should toggle every TRACECK edge -- ETM not involved."
echo " To stop the pattern and return to normal: mww 0x5C015204 0, or reload"
echo " etm_enable_h743.cfg."
echo "==================================================================="
