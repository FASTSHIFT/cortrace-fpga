# OpenOCD: stop the TPIU CURTPM test pattern (unlock + write CURTPM=0) without
# resetting the CPU. Used to create a TRACECLK/data gap for gap-tolerance
# testing of the source-synchronous IDDR capture path.
init
mww 0x5C015FB0 0xC5ACCE55   ;# unlock CoreSight
mww 0x5C015204 0            ;# CURTPM = 0 -> stop pattern
echo "CURTPM stopped (=0)"
shutdown
