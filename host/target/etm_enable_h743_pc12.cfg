# OpenOCD: STM32H743 Cortex-M7 4-bit parallel ETM trace with TRACED3 remapped
# to PC12 (via AF0). See etm_enable_h743.cfg for the base sequence; only the
# GPIO section differs.
#
# WHY PC12: on-chip logic-analyzer capture (trace_pin_la_top) showed PE6/
# TRACED3 pin had ~40% data-vs-clock edge overlap and 8.5x the edge rate of
# PE3-5 -- most likely a package-level output-driver issue on this particular
# H743 die (H743 datasheet AF map lists TRACED3 with an alternate binding on
# PC12, so a hardware relocation costs a single flywire).
#
# Trace pins used:
#   TRACECK=PE2, TRACED0=PE3, TRACED1=PE4, TRACED2=PE5   (unchanged)
#   TRACED3=PC12   (moved from PE6; flywire from A7-Lite E16 pad to STM32 PC12)
#
# The rest of the sequence (DBGMCU, TPIU, CSTF, ETF, ETMv4 program) is verbatim
# from etm_enable_h743.cfg -- only the GPIO stage changes.

init
reset halt

# ==================================================================
# 0a) GPIOE: clock + PE2..PE5 -> AF0 (trace). PE6 is INTENTIONALLY LEFT
#     as an input (MODER=00 for that pin) so a stale AF driver from a
#     previous session or firmware can't fight PC12.
# ==================================================================
# RCC_AHB4ENR bit4 = GPIOEEN, bit2 = GPIOCEN
mww 0x580244E0 [expr {[mrw 0x580244E0] | 0x00000014}]

# MODER: PE2..PE5 -> 10 (alternate function). PE6 -> 00 (input; force off).
#   PE2 bits[5:4], PE3 [7:6], PE4 [9:8], PE5 [11:10], PE6 [13:12]
set moder [mrw 0x58021000]
set moder [expr {$moder & ~(0x3FFF << 4)}]
set moder [expr {$moder | (0x2 << 4) | (0x2 << 6) | (0x2 << 8) | (0x2 << 10)}]
mww 0x58021000 $moder

# OSPEEDR: PE2..PE5 -> 11 (very high speed)
set ospeedr [mrw 0x58021008]
set ospeedr [expr {$ospeedr & ~(0x3FFF << 4)}]
set ospeedr [expr {$ospeedr | (0x3 << 4) | (0x3 << 6) | (0x3 << 8) | (0x3 << 10)}]
mww 0x58021008 $ospeedr

# OTYPER (+0x04): push-pull (clear bits 2..5)
mww 0x58021004 [expr {[mrw 0x58021004] & ~(0x3C)}]

# AFRL (+0x20): PE2..PE5 -> AF0. Clear the nibbles.
#   PE2 [11:8], PE3 [15:12], PE4 [19:16], PE5 [23:20] -- clear all 16 bits
set afrl [mrw 0x58021020]
set afrl [expr {$afrl & ~(0xFFFF << 8)}]
mww 0x58021020 $afrl

# ==================================================================
# 0b) GPIOC PC12 -> AF0 (TRACED3 alternate binding).
#     GPIOC base = 0x58020800.
# ==================================================================
# MODER: PC12 -> 10 (AF).  PC12 bits [25:24].
set moder_c [mrw 0x58020800]
set moder_c [expr {$moder_c & ~(0x3 << 24)}]
set moder_c [expr {$moder_c | (0x2 << 24)}]
mww 0x58020800 $moder_c

# OSPEEDR: PC12 -> 11 (very high speed).  Bits [25:24].
set ospeedr_c [mrw 0x58020808]
set ospeedr_c [expr {$ospeedr_c | (0x3 << 24)}]
mww 0x58020808 $ospeedr_c

# OTYPER: PC12 push-pull (clear bit 12).
mww 0x58020804 [expr {[mrw 0x58020804] & ~(1 << 12)}]

# AFRH (+0x24): PC12 alternate function nibble [19:16] = AF0.
set afrh_c [mrw 0x58020824]
set afrh_c [expr {$afrh_c & ~(0xF << 16)}]
mww 0x58020824 $afrh_c

# ==================================================================
# The rest -- core trace power, DBGMCU, TPIU, CSTF, ETF, ETM -- is
# byte-for-byte the same as etm_enable_h743.cfg. Duplicated here rather
# than sourced so the file is self-contained.
# ==================================================================

# 1) DEMCR.TRCENA (bit24)
mww 0xE000EDFC 0x01000000

# 2) DBGMCU_CR: TRACECLKEN + D1DBGCKEN + D3DBGCKEN
mww 0x5C001004 [expr {[mrw 0x5C001004] | 0x00700000}]

# 3) TPIU @ 0x5C015000
mww 0x5C015FB0 0xC5ACCE55
mww 0x5C015004 0x00000008
mww 0x5C0150F0 0x00000000
mww 0x5C015304 0x00000102

# 3b) CSTF @ 0x5C013000: enable slave 0 (ETM)
mww 0x5C013FB0 0xC5ACCE55
mww 0x5C013000 [expr {[mrw 0x5C013000] | 0x00000001}]

# 3c) ETF @ 0x5C014000: HW-FIFO mode
mww 0x5C014020 0x00000000
mww 0x5C014FB0 0xC5ACCE55
mww 0x5C014028 0x00000002
mww 0x5C014304 0x00000001
mww 0x5C014020 0x00000001

# 4) ETMv4 @ 0xE0041000
mww 0xE0041FB0 0xC5ACCE55
mww 0xE0041310 0x00000008        ;# TRCPDCR.PU = 1
mww 0xE0041004 0x00000000        ;# TRCPRGCTLR.EN = 0

set idle 0
for {set i 0} {$i < 100} {incr i} {
    if {[expr {[mrw 0xE004100C] & 0x1}]} { set idle 1; break }
}
if {!$idle} { echo "WARN: ETM did not reach IDLE (TRCSTATR.IDLE=0)" }

# TRCCONFIGR: BB off by default (proposal 29)
set trace_bb 0
if {[info exists ::env(TRACE_BB)]} { set trace_bb $::env(TRACE_BB) }
mww 0xE0041010 [expr {$trace_bb ? 0x00000008 : 0x00000000}]

# TRCTRACEIDR = 2
mww 0xE0041040 0x00000002

# TRCSTALLCTLR: max stall (lossless) unless env disables it
set trace_stall 1
if {[info exists ::env(TRACE_STALL)]} { set trace_stall $::env(TRACE_STALL) }
mww 0xE004102C [expr {$trace_stall ? 0x0000010C : 0x00000000}]

# TRCVICTLR: trace-all + started
mww 0xE0041080 0x00000201

# TRCSYNCPR
mww 0xE0041034 0x0000000C

# START tracing
mww 0xE0041004 0x00000001

echo "==================== READBACK ===================="
echo "GPIOC_MODER   = [format 0x%08x [mrw 0x58020800]]  (PC12 bits 25..24 = 10b)"
echo "GPIOC_OSPEEDR = [format 0x%08x [mrw 0x58020808]]  (PC12 bits 25..24 = 11b)"
echo "GPIOC_AFRH    = [format 0x%08x [mrw 0x58020824]]  (PC12 nibble bits 19..16 = 0 = AF0)"
echo "GPIOE_MODER   = [format 0x%08x [mrw 0x58021000]]  (PE2..5 = 10b, PE6 = 00b)"
echo "GPIOE_OSPEEDR = [format 0x%08x [mrw 0x58021008]]  (PE2..5 = 11b)"
echo "GPIOE_AFRL    = [format 0x%08x [mrw 0x58021020]]  (PE2..5 nibbles = 0)"
echo "DBGMCU_CR     = [format 0x%08x [mrw 0x5C001004]]  (bits 20/21/22 set)"
echo "ETF_MODE      = [format 0x%08x [mrw 0x5C014028]]  (expect 0x02)"
echo "ETF_CTL       = [format 0x%08x [mrw 0x5C014020]]  (expect 0x01)"
echo "TPIU_CURPSIZE = [format 0x%08x [mrw 0x5C015004]]  (expect 0x08 = 4-bit)"
echo "TRCPRGCTLR    = [format 0x%08x [mrw 0xE0041004]]  (expect 0x01)"
echo "TRCTRACEIDR   = [format 0x%08x [mrw 0xE0041040]]  (expect 0x02)"

resume

echo "==================================================================="
echo " H743 ETMv4 4-bit trace enabled. TRACECK=PE2 TRACED0=PE3 TRACED1=PE4"
echo " TRACED2=PE5 TRACED3=**PC12** (moved from PE6, PE6 tri-stated)."
echo "==================================================================="
