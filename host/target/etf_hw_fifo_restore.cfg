# OpenOCD: restore the H743 ETF to HW-FIFO mode after etf_dump_h743.cfg has
# freeze-and-drained it (which leaves MODE=0, TraceCaptEn=0). This puts the
# TPIU parallel port back to live so FPGA capture resumes.
#
# Deliberately does NOT reset the ETM -- it only touches the ETF (0x5C014000).
# ETM stays enabled from the firmware selftrace_run(), just like AGENT.md
# 2026-08-23 §11.1 (etf-golden -> restore -> fpga-capture) blueprint.

init
halt

# Stop the ETF, unlock, set mode = HW-FIFO, re-enable.
mww 0x5C014020 0x00000000        ;# CTL: TraceCaptEn = 0
mww 0x5C014FB0 0xC5ACCE55        ;# LAR unlock
mww 0x5C014028 0x00000002        ;# MODE = 2 (HW-FIFO -> TPIU)
mww 0x5C014304 0x00000001        ;# FFCR: EnFt (continuous formatter)
mww 0x5C014020 0x00000001        ;# CTL: TraceCaptEn = 1

echo "ETF_MODE = [format 0x%08x [mrw 0x5C014028]]  (expect 0x02)"
echo "ETF_CTL  = [format 0x%08x [mrw 0x5C014020]]  (expect 0x01)"

resume
shutdown
