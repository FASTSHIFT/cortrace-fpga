# ETM + ITM/DWT both enabled. Rationale (from orbtrace gdbtrace.init): the
# TPIU formatter only has reason to emit frame sync (0xFFFFFF7F) + channel IDs
# when it is multiplexing. With a single ETM source some implementations let
# data pass without inserting recognisable frames. Turning ITM on as a second
# source forces the formatter to frame/sync — which is what the PC TPIU
# decoder (and orbtrace's tpiu_demux) expect.
#
#   openocd -f interface/stlink.cfg -f target/stm32f4x.cfg -f etm_itm_enable.cfg

init
reset halt

# ---- GPIOE PE2..6 -> AF0 (trace), very-high-speed (same as etm_enable.cfg) ----
mww 0x40023830 [expr {[mrw 0x40023830] | 0x00000010}]
set moder [mrw 0x40021000]
set moder [expr {$moder & ~(0x3FFF << 4)}]
set moder [expr {$moder | (0x2 << 4) | (0x2 << 6) | (0x2 << 8) | (0x2 << 10) | (0x2 << 12)}]
mww 0x40021000 $moder
set ospeedr [mrw 0x40021008]
set ospeedr [expr {$ospeedr | (0x3 << 4) | (0x3 << 6) | (0x3 << 8) | (0x3 << 10) | (0x3 << 12)}]
mww 0x40021008 $ospeedr
mww 0x40021004 [expr {[mrw 0x40021004] & ~(0x7C)}]
set afrl [mrw 0x40021020]
set afrl [expr {$afrl & ~(0xFFFFF << 8)}]
mww 0x40021020 $afrl

# ---- DEMCR.TRCENA ----
mww 0xE000EDFC 0x01000000
# ---- DBGMCU_CR: TRACE_IOEN + 4-bit ----
mww 0xE0042004 0x000000E0
# ---- TPIU: parallel, 4-bit, formatter on ----
mww 0xE0040004 0x00000008
mww 0xE00400F0 0x00000000
mww 0xE0040010 0x0000000F
mww 0xE0040304 0x00000102

# ---- ITM + DWT: second trace source to force formatter framing ----
# ITM lock access
mww 0xE0000FB0 0xC5ACCE55
# ITM TCR: ITMENA(0) | TSENA(1) | SYNCENA(2) | TXENA(3=DWT fwd) | TraceBusID=1<<16
mww 0xE0000E80 0x0001000D
# Enable all stimulus ports
mww 0xE0000E00 0xFFFFFFFF
# DWT: enable sync packets + PC sampling. CTRL:
#   CYCCNTENA(0)=1, PCSAMPLENA(12)=1, SYNCTAP(10:11)=01 (CYCCNT[24]),
#   POSTPRESET, CYCTAP(9)=1, EXCTRCENA(16)=1
mww 0xE0001000 0x40010BFF

# ---- ETM (same known-good sequence) ----
mww 0xE0041FB0 0xC5ACCE55
mww 0xE0041000 0x00000400
mww 0xE0041000 0x00000D80
mww 0xE0041200 0x00000002
mww 0xE0041024 0x00000000
mww 0xE004102C 0x00000018
mww 0xE0041020 0x0000006F
mww 0xE0041000 0x00000980

echo "==================== READBACK ===================="
echo "TPIU_FFCR  = [format 0x%08x [mrw 0xE0040304]]"
echo "ITM_TCR    = [format 0x%08x [mrw 0xE0000E80]]"
echo "DWT_CTRL   = [format 0x%08x [mrw 0xE0001000]]"
echo "ETMCR      = [format 0x%08x [mrw 0xE0041000]]"
echo "ETMTEEVR   = [format 0x%08x [mrw 0xE0041020]]"
resume
echo "==> ETM+ITM running. Re-arm FPGA then capture; expect TPIU 0xFFFFFF7F sync now."
