# OpenOCD: enable STM32F429 4-bit parallel ETM trace, FULL sequence
# including the GPIO alternate-function muxing that DBGMCU_CR alone does
# NOT do (confirmed: GPIO toggle on PE2 works, so the pin is fine; trace
# output needs PE2..PE6 switched to AF0 + high speed by hand).
#
# STM32F429I-DISC1 trace pins (AF0):
#   TRACECLK=PE2  TRACED0=PE3  TRACED1=PE4  TRACED2=PE5  TRACED3=PE6
#
# Run:
#   openocd -f interface/stlink.cfg -f target/stm32f4x.cfg -f etm_enable.cfg

init
reset halt

# ==================================================================
# 0) GPIOE: clock + put PE2..PE6 into Alternate Function 0 (trace), very
#    high speed, push-pull. GPIOE base 0x40021000.
# ==================================================================
# RCC_AHB1ENR bit4 = GPIOEEN
mww 0x40023830 [expr {[mrw 0x40023830] | 0x00000010}]

# MODER: PE2..PE6 -> 10 (alternate function). Each pin = 2 bits.
#   PE2 bits5:4, PE3 7:6, PE4 9:8, PE5 11:10, PE6 13:12
set moder [mrw 0x40021000]
# clear bits [13:4] then set all to 10 pattern
set moder [expr {$moder & ~(0x3FFF << 4)}]
set moder [expr {$moder | (0x2 << 4) | (0x2 << 6) | (0x2 << 8) | (0x2 << 10) | (0x2 << 12)}]
mww 0x40021000 $moder

# OSPEEDR: PE2..PE6 -> 11 (very high speed)
set ospeedr [mrw 0x40021008]
set ospeedr [expr {$ospeedr | (0x3 << 4) | (0x3 << 6) | (0x3 << 8) | (0x3 << 10) | (0x3 << 12)}]
mww 0x40021008 $ospeedr

# OTYPER: push-pull (clear bits 2..6) -- default 0, ensure
mww 0x40021004 [expr {[mrw 0x40021004] & ~(0x7C)}]

# AFRL (0x20): PE2..PE6 alternate function = AF0 (trace). Each pin = 4 bits.
#   PE2 bits[11:8], PE3 [15:12], PE4 [19:16], PE5 [23:20], PE6 [27:24]
#   AF0 = 0, so just clear those nibbles.
set afrl [mrw 0x40021020]
set afrl [expr {$afrl & ~(0xFFFFF << 8)}]
mww 0x40021020 $afrl

# ==================================================================
# 1) Core trace power: DEMCR.TRCENA (bit24)
# ==================================================================
mww 0xE000EDFC 0x01000000

# 2) DBGMCU_CR: TRACE_IOEN (bit5) + TRACE_MODE=11 (4-bit parallel)
mww 0xE0042004 0x000000E0

# 3) TPIU: 4-bit, parallel, slow-ish clock (prescaler /16 to be scope-safe)
mww 0xE0040004 0x00000008
mww 0xE00400F0 0x00000000
mww 0xE0040010 0x0000000F
mww 0xE0040304 0x00000102

# 4) ETM (ETM3.5 / CoreSight ETM-M4): per the known-good STM32F4 sequence
#    (PetteriAimonen/STM32_Trace_Example + mcuoneclipse). Two bugs fixed vs
#    the old version: ETMTECR1 must be 0x01000000 (bit24 = trace always
#    enabled), NOT 0x20000001; and ETMCR must be 0xc80 (stall + prog bit10),
#    with the Programming bit (0x400) cleared LAST to actually start tracing.
#
#    BRANCH BROADCAST (bit8) ON — this is the key continuity lever (doc 14 §9).
#    bit8=1 ("branch output all", IHI0014Q ETMCR[8]) makes EVERY taken branch,
#    including DIRECT ones, emit a Branch Address packet. That keeps the flow
#    decoder (orbmortem/orbetm) anchored between the hardware's fixed 1024-byte
#    I-sync period; without it an unresolved indirect return runs the PC away
#    into the vector table. Measured through orbuculum's own decoder: broadcast
#    ON recovers 18.8% in-code instructions vs 2.6% OFF (7x better).
#
#    (We briefly tried bit8 OFF / 0xc80 to match a hand-rolled image-walk
#    decoder, but that starves the real flow walker. ETMSYNCFR is read-only at
#    0x400=1024B on this M4 — probed: writes to 0x100/0x40 read back 0x400 — so
#    branch broadcast is the ONLY available knob to densify anchoring.)
#
# unlock
mww 0xE0041FB0 0xC5ACCE55
# enter programming mode (ETMCR bit10)
mww 0xE0041000 0x00000400
# main control: 0xd80 = stall + branch broadcast (bit8) + prog bit10
mww 0xE0041000 0x00000D80
# TraceID = 2
mww 0xE0041200 0x00000002
# ETMTECR1 (+0x24): with NO address comparators (ETMCCR[3:0]=0), only bit25
# (trace start/stop enable) is implemented here. bit25=0 => tracing is
# controlled purely by the TraceEnable event (TEEVR), i.e. "trace always"
# when TEEVR=0x6f. So the correct value is 0 (NOT 0x01000000 — bit24 is
# unimplemented and reads back 0). Probed: writing 0xFFFFFFFF reads 0x02000000.
mww 0xE0041024 0x00000000
# ETMFFLR (+0x2c) = 24 : stall when <24 bytes free in FIFO
mww 0xE004102C 0x00000018
# TraceEnable event = always TRUE (0x6f)
mww 0xE0041020 0x0000006F
# START tracing: clear the Programming bit (0x400) LAST. 0xd80 & ~0x400 = 0x980
mww 0xE0041000 0x00000980

echo "==================== READBACK ===================="
echo "GPIOE_MODER   = [format 0x%08x [mrw 0x40021000]]  (PE2..6 = 10b each: ..2AA0 region)"
echo "GPIOE_OSPEEDR = [format 0x%08x [mrw 0x40021008]]"
echo "GPIOE_AFRL    = [format 0x%08x [mrw 0x40021020]]  (PE2..6 nibbles = 0 = AF0)"
echo "DBGMCU_CR     = [format 0x%08x [mrw 0xE0042004]]"
echo "TPIU_CSPSR    = [format 0x%08x [mrw 0xE0040004]]"
echo "TPIU_ACPR     = [format 0x%08x [mrw 0xE0040010]]"
echo "ETMCR         = [format 0x%08x [mrw 0xE0041000]]  (expect 0x980: started, prog bit cleared, branch-bcast ON)"
echo "ETMTECR1      = [format 0x%08x [mrw 0xE0041024]]  (expect 0: trace-all via TEEVR; bit25=0)"
echo "ETMTEEVR      = [format 0x%08x [mrw 0xE0041020]]  (expect 0x6f)"

resume

echo "==================================================================="
echo " Trace pins now in AF0. TRACECLK on PE2 (prescaled /16). Probe it."
echo " Target RUNNING. Ctrl-C to stop."
echo "==================================================================="
