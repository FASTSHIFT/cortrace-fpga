# OpenOCD: emit a PREDICTABLE, HIGH-ENTROPY byte ramp on the real 4-bit TPIU
# parallel port via ITM software trace (stimulus port 0), then run a tiny RAM
# stub that writes an incrementing counter forever. This fills the gap that the
# TPIU built-in test patterns (AA55/FF00/W1/W0) cannot: a changing, data-
# dependent stream over the exact same pins + IDDR the real ETM uses, so the
# host can verify each ITM payload byte == expected count and measure the
# capture error rate on high-entropy traffic.
#
# TRACECLK comes from the flashed firmware PLL (do not reset -> keep it up).
# Run:  openocd -f interface/cmsis-dap.cfg -f target/stm32h7x.cfg \
#               -f syn/artix7/bringup/target/itm_ramp_h743.cfg

init
reset halt

# ---- clocks + pin mux (same as the TPIU test-pattern bring-up) ----
# GPIOEEN
mww 0x580244E0 [expr {[mrw 0x580244E0] | 0x00000010}]
# PE2..PE6 -> AF (mode 10)
set m [mrw 0x58021000]
set m [expr {$m & ~(0x3FFF << 4)}]
set m [expr {$m | (0x2 << 4) | (0x2 << 6) | (0x2 << 8) | (0x2 << 10) | (0x2 << 12)}]
mww 0x58021000 $m
# OSPEEDR very-high
set s [mrw 0x58021008]
set s [expr {$s | (0x3FF << 4)}]
mww 0x58021008 $s
# OTYPER push-pull
mww 0x58021004 [expr {[mrw 0x58021004] & ~(0x7C)}]
# AFRL PE2..6 -> AF0
set afrl [mrw 0x58021020]
set afrl [expr {$afrl & ~(0xFFFFF << 8)}]
mww 0x58021020 $afrl

# ---- DEMCR.TRCENA ----
mww 0xE000EDFC 0x01000000
# ---- DBGMCU_CR: TRACECLKEN + D1/D3 clocks ----
mww 0x5C001004 [expr {[mrw 0x5C001004] | 0x00700000}]

# ---- TPIU: 4-bit parallel, continuous formatter ON (ITM needs the formatter) ----
mww 0x5C015FB0 0xC5ACCE55   ;# unlock
mww 0x5C015004 0x00000008   ;# CURPSIZE = 4-bit
mww 0x5C0150F0 0x00000000   ;# SPPR = parallel trace port
mww 0x5C015304 0x00000102   ;# FFCR: EnFCont (formatter on) = 0x102
mww 0x5C015204 0            ;# make sure the CURTPM test pattern is OFF

# ---- ITM: unlock, enable, stimulus port 0 ----
mww 0xE0000FB0 0xC5ACCE55   ;# ITM LAR unlock
# TCR: ITMENA(bit0)=1, TSENA(bit1)=1, SYNCENA(bit2)=1, TXENA(bit3)=1,
#      TraceBusID(bits[22:16])=1  -> 0x0001000F
mww 0xE0000E80 0x0001000F
# TER: enable stimulus port 0
mww 0xE0000E00 0x00000001
# TPR: unprivileged access to ports (harmless here)
mww 0xE0000E40 0x0000000F

# ---- load the RAM stub (assembled from itm_ramp.s, PC-independent) ----
mww 0x24000000 0x4060f04f
mww 0x24000004 0x68022100
mww 0x24000008 0xd0fc2a00
mww 0x2400000c 0x31017001
mww 0x24000010 0x0000e7f9

# set PC to the stub (thumb) and go
reg pc 0x24000000
resume

echo "==================== READBACK ===================="
echo "TPIU_CURPSIZE = [format 0x%08x [mrw 0x5C015004]]  (expect 0x08)"
echo "TPIU_SPPR     = [format 0x%08x [mrw 0x5C0150F0]]  (expect 0x00 parallel)"
echo "TPIU_FFCR     = [format 0x%08x [mrw 0x5C015304]]  (expect 0x102)"
echo "TPIU_CURTPM   = [format 0x%08x [mrw 0x5C015204]]  (expect 0 = pattern OFF)"
echo "ITM_TCR       = [format 0x%08x [mrw 0xE0000E80]]  (expect ITMENA+TXENA+busID1)"
echo "ITM_TER       = [format 0x%08x [mrw 0xE0000E00]]  (expect 0x1 port0)"
echo "ITM stimulus ramp running from RAM 0x24000000; TPIU 4-bit parallel."
shutdown
