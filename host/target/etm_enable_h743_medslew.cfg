# OpenOCD: STM32H743 ETMv4 trace with MEDIUM-speed GPIO (OSPEEDR=01).
# Motivation (proposal 33-followup, empirical SSN measurement):
#   pin_multi_toggle showed that when 4 trace lanes toggle simultaneously the
#   floating/pulled-down neighbour (D3) picks up ~13% ghost edges from SSN
#   through the GPIOE port supply -- even with the SWD-driver's slow toggle.
#   At the real 50 MHz TPIU rate this scales dramatically and is the source
#   of the "D3 40% edges near CLK" symptom.
#
# Reducing OSPEEDR from 11 (very-high) to 01 (medium) drops the edge slew,
# lowering dI/dt and thus SSN, at the cost of slightly slower edges (still
# well within the 10 ns UI of 50 MHz TRACECLK).
#
# All other settings match etm_enable_h743.cfg.

init
reset halt

# GPIOEEN
mww 0x580244E0 [expr {[mrw 0x580244E0] | 0x00000010}]

# MODER: PE2..PE6 -> 10 (alternate function)
set moder [mrw 0x58021000]
set moder [expr {$moder & ~(0x3FFF << 4)}]
set moder [expr {$moder | (0x2 << 4) | (0x2 << 6) | (0x2 << 8) | (0x2 << 10) | (0x2 << 12)}]
mww 0x58021000 $moder

# OSPEEDR: PE2..PE6 -> 01 (MEDIUM speed). This is the change vs the base cfg.
set ospeedr [mrw 0x58021008]
set ospeedr [expr {$ospeedr & ~(0x3FF << 4)}]
set ospeedr [expr {$ospeedr | (0x1 << 4) | (0x1 << 6) | (0x1 << 8) | (0x1 << 10) | (0x1 << 12)}]
mww 0x58021008 $ospeedr

# OTYPER: push-pull
mww 0x58021004 [expr {[mrw 0x58021004] & ~(0x7C)}]

# AFRL: PE2..PE6 -> AF0
set afrl [mrw 0x58021020]
set afrl [expr {$afrl & ~(0xFFFFF << 8)}]
mww 0x58021020 $afrl

# ============ trace subsystem (unchanged) ============
mww 0xE000EDFC 0x01000000
mww 0x5C001004 [expr {[mrw 0x5C001004] | 0x00700000}]

mww 0x5C015FB0 0xC5ACCE55
mww 0x5C015004 0x00000008
mww 0x5C0150F0 0x00000000
mww 0x5C015304 0x00000102

mww 0x5C013FB0 0xC5ACCE55
mww 0x5C013000 [expr {[mrw 0x5C013000] | 0x00000001}]

mww 0x5C014020 0x00000000
mww 0x5C014FB0 0xC5ACCE55
mww 0x5C014028 0x00000002
mww 0x5C014304 0x00000001
mww 0x5C014020 0x00000001

mww 0xE0041FB0 0xC5ACCE55
mww 0xE0041310 0x00000008
mww 0xE0041004 0x00000000

set idle 0
for {set i 0} {$i < 100} {incr i} {
    if {[expr {[mrw 0xE004100C] & 0x1}]} { set idle 1; break }
}
if {!$idle} { echo "WARN: ETM did not reach IDLE" }

set trace_bb 0
if {[info exists ::env(TRACE_BB)]} { set trace_bb $::env(TRACE_BB) }
mww 0xE0041010 [expr {$trace_bb ? 0x00000008 : 0x00000000}]

mww 0xE0041040 0x00000002

set trace_stall 1
if {[info exists ::env(TRACE_STALL)]} { set trace_stall $::env(TRACE_STALL) }
mww 0xE004102C [expr {$trace_stall ? 0x0000010C : 0x00000000}]

mww 0xE0041080 0x00000201
mww 0xE0041034 0x0000000C
mww 0xE0041004 0x00000001

echo "==================== READBACK ===================="
echo "GPIOE_OSPEEDR = [format 0x%08x [mrw 0x58021008]]  (expect PE2..6 = 01b each = 0x?555?)"
echo "TRCPRGCTLR    = [format 0x%08x [mrw 0xE0041004]]"
echo "TRCTRACEIDR   = [format 0x%08x [mrw 0xE0041040]]"

resume

echo "==================================================================="
echo " H743 ETMv4 4-bit trace w/ MEDIUM slew (OSPEEDR=01) -- SSN mitigation"
echo "==================================================================="
