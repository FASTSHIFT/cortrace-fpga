# OpenOCD: halt the CPU and arm a CURTPM test pattern on the TPIU 4-bit port
# WITHOUT touching the PLL (keeps whatever TRACECLK the flashed firmware set).
# Used to measure the pure capture-layer byte-error rate at the *current*
# TRACECLK with a known pattern (decouples the FPGA sampling front-end from the
# high-entropy real-ETM stream).
#
# Pattern via env CURTPM_VAL:
#   0x00020001 walking-1s  (single bit rotates across lanes; strict rotation
#                           criterion catches lane skew + drop/extra nibble)
#   0x00020008 FF/00        (all 4 lanes toggle together, max transition density)
#   0x00020004 AA/55        (lenient synchronous square wave)
#
#   CURTPM_VAL=0x00020001 openocd -f interface/cmsis-dap.cfg \
#       -f target/stm32h7x.cfg -f syn/artix7/bringup/target/arm_walking_h743.cfg

init
halt

# GPIOE PE2..PE6 -> AF0 trace, very high speed, push-pull.
mww 0x580244E0 [expr {[mrw 0x580244E0] | 0x00000010}]
set moder [mrw 0x58021000]
set moder [expr {$moder & ~(0x3FFF << 4)}]
set moder [expr {$moder | (0x2 << 4) | (0x2 << 6) | (0x2 << 8) | (0x2 << 10) | (0x2 << 12)}]
mww 0x58021000 $moder
set ospeedr [mrw 0x58021008]
set ospeedr [expr {$ospeedr | (0x3 << 4) | (0x3 << 6) | (0x3 << 8) | (0x3 << 10) | (0x3 << 12)}]
mww 0x58021008 $ospeedr
mww 0x58021004 [expr {[mrw 0x58021004] & ~(0x7C)}]
set afrl [mrw 0x58021020]
set afrl [expr {$afrl & ~(0xFFFFF << 8)}]
mww 0x58021020 $afrl

# Trace power/clocks on.
mww 0xE000EDFC 0x01000000
mww 0x5C001004 [expr {[mrw 0x5C001004] | 0x00700000}]

# TPIU: 4-bit parallel, continuous formatting, unlock.
mww 0x5C015FB0 0xC5ACCE55
mww 0x5C015004 0x00000008
mww 0x5C0150F0 0x00000000
mww 0x5C015304 0x00000102

set curtpm 0x00020001
if {[info exists ::env(CURTPM_VAL)]} { set curtpm $::env(CURTPM_VAL) }
mww 0x5C015204 $curtpm

echo "CURTPM armed = [format 0x%08x [mrw 0x5C015204]]  (CPU halted, PLL untouched)"
echo "PLL1DIVR     = [format 0x%08x [mrw 0x58024430]]"
shutdown
