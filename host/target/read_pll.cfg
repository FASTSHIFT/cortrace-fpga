# Read the full PLL1 clock tree from a running H743 (no reset/halt).
init
echo "RCC_CR       = [format 0x%08x [mrw 0x58024400]]"
echo "RCC_PLLCKSELR= [format 0x%08x [mrw 0x58024428]]  (DIVM1 bits[9:4], PLLSRC[1:0])"
echo "RCC_PLLCFGR  = [format 0x%08x [mrw 0x5802442C]]"
echo "RCC_PLL1DIVR = [format 0x%08x [mrw 0x58024430]]  (N[8:0] P[15:9] Q[22:16] R[30:24])"
echo "RCC_CFGR     = [format 0x%08x [mrw 0x58024410]]"
echo "RCC_D1CFGR   = [format 0x%08x [mrw 0x58024418]]"
shutdown
