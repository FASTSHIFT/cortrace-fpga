# OpenOCD: capture ETM trace into the ETF (TMC) in CIRCULAR-BUFFER mode and
# drain it over the DAP (SWD). The DAP read path has parity + retry, so the
# bytes read back are the GOLDEN ETM output -- they cannot be corrupted by the
# TPIU parallel port / FPGA IDDR sampling that we are trying to characterise.
#
# This is the reference side of the cross-check: run a deterministic program,
# read the true ETM byte sequence here, then (separately) capture the same
# program's TPIU output on the FPGA and diff.
#
# ETF (CoreSight TMC, SoC-400) at system-bus 0x5C014000. Register offsets:
#   RSZ  +0x004  RAM size in 32-bit words (RO)
#   STS  +0x00C  status: bit0 Full? no -> bit2 Full, bit0=RXFULL varies; use RRP/RWP
#   RRD  +0x010  RAM Read Data (each read pops one 32-bit word; 0xFFFFFFFF = empty)
#   RRP  +0x014  RAM Read Pointer
#   RWP  +0x018  RAM Write Pointer
#   CTL  +0x020  bit0 TraceCaptEn
#   MODE +0x028  0=Circular Buffer, 1=SW FIFO, 2=HW FIFO
#   FFCR +0x304  bit0 EnFt (formatter), bit6 StopOnFl, bit12 FOnMan (manual flush)
#   LAR  +0xFB0  0xC5ACCE55 unlock
#
# Env: DUMP_WORDS = how many 32-bit words to drain (default 1024 = 4KB = full ETF)

init
halt

set nwords 1024
if {[info exists ::env(DUMP_WORDS)]} { set nwords $::env(DUMP_WORDS) }

# ---- ETM must already be enabled + producing (run etm_enable/self-branch or
#      firmware first). Here we (re)point the ETF to CIRCULAR mode and let it
#      fill from the funnel. ----

# Stop the ETF to reprogram it
mww 0x5C014FB0 0xC5ACCE55        ;# unlock
mww 0x5C014020 0x00000000        ;# CTL: TraceCaptEn = 0 (stop)
# wait for it to drain/idle a moment
sleep 5

# Circular buffer mode.
# FFCR: EnFt = 0 (do NOT frame in the ETF). We want the RAW ETMv4 byte
# stream in the golden dump, not TPIU-formatted frames -- the TPIU frame
# layer is what we're trying to characterise on the FPGA side, so having
# it also present in the "golden" would defeat the purpose (and the
# deframer heuristic in opencsd_etm4_run doesn't detect frames in a
# 4KB slice reliably, so we'd end up passing framed bytes through as
# raw and confusing the decoder).
mww 0x5C014028 0x00000000        ;# MODE = 0 (circular buffer)
mww 0x5C014304 0x00000000        ;# FFCR: EnFt=0 (raw ETM stored)
# Re-enable capture
mww 0x5C014020 0x00000001        ;# CTL: TraceCaptEn = 1

# Let it fill (CPU is running its loop -> ETM produces -> funnel -> ETF)
resume
sleep 200
halt

# Stop capture, flush the formatter
mww 0x5C014304 [expr {[mrw 0x5C014304] | 0x00001040}]  ;# FOnMan + StopOnFl
mww 0x5C014020 0x00000000        ;# CTL = 0 (stop, freeze buffer)

echo "==== ETF state ===="
echo "RSZ  = [format 0x%08x [mrw 0x5C014004]] words"
echo "STS  = [format 0x%08x [mrw 0x5C01400C]]"
echo "RRP  = [format 0x%08x [mrw 0x5C014014]]"
echo "RWP  = [format 0x%08x [mrw 0x5C014018]]"
echo "MODE = [format 0x%08x [mrw 0x5C014028]]"

# Set read pointer to 0 to read the whole RAM from the start
mww 0x5C014014 0x00000000

echo "==== ETF RAM DUMP (RRD x $nwords) ===="
for {set i 0} {$i < $nwords} {incr i} {
    echo [format "%08x" [mrw 0x5C014010]]
}
echo "==== END DUMP ===="
shutdown
