# OpenOCD: run a MINIMAL self-branch loop (b .) from RAM with ETMv4 4-bit trace,
# so the ETM output is HAND-DERIVABLE for physical byte-for-byte cross-check.
#
# The loop is one instruction: `b .` (0xE7FE) at 0x24000000. Every iteration is
# one taken direct branch => one E (executed) Atom element (IHI0064H.b §2.3.1:
# "a direct branch generates a P0 element regardless of condition check").
#
# HAND-DERIVED steady-state ETM instruction stream (IHI0064H.b §6.4.13):
#   * runs of E atoms pack into Atom Format 6: header 0b11 A CCCCC,
#     atoms = (COUNT+3) initial E + 1 final(A).
#   * max all-E run: A=0, COUNT=0b10100(20) => 24 E atoms => byte 0xD4.
#   => after each A-Sync(>=11x 0x00, then 0x80) + Trace Info(0x01 ...) + initial
#      Address packet, the stream is a solid run of 0xD4 bytes, forever.
# No loads/stores, no calls, no exceptions, no interrupts -> nothing else in the
# instruction stream. This is the cleanest possible physical-layer cross-check.
#
# BB=0 (no per-branch address), STALL=0 (no CPU throttle -> no timing
# perturbation), SysTick/interrupts never enabled (we run our own code, not the
# firmware). TRACECLK = whatever the flashed firmware PLL left (we do reset halt
# but never run firmware; PLL1 stays configured from the last power-on/flash).
#
# Run:
#   openocd -f interface/cmsis-dap.cfg -f target/stm32h7x.cfg \
#           -f syn/artix7/bringup/target/etm_selfbranch_h743.cfg

init
reset halt

# ---- GPIOE PE2..PE6 -> AF0 trace, very-high speed, push-pull ----
mww 0x580244E0 [expr {[mrw 0x580244E0] | 0x00000010}]
set moder [mrw 0x58021000]
set moder [expr {$moder & ~(0x3FFF << 4)}]
set moder [expr {$moder | (0x2 << 4) | (0x2 << 6) | (0x2 << 8) | (0x2 << 10) | (0x2 << 12)}]
mww 0x58021000 $moder
set ospeedr [mrw 0x58021008]
set ospeedr [expr {$ospeedr | (0x3 << 4) | (0x3 << 6) | (0x3 << 8) | (0x3 << 10) | (0x3 << 12)}]
mww 0x58021008 $ospeedr
mww 0x58021004 [expr {[mrw 0x58021004] & ~(0x7C)}]
set afrl [mrw 0x58021020]
set afrl [expr {$afrl & ~(0xFFFFF << 8)}]
mww 0x58021020 $afrl

# ---- core trace power + trace clocks ----
mww 0xE000EDFC 0x01000000
mww 0x5C001004 [expr {[mrw 0x5C001004] | 0x00700000}]

# ---- TPIU 4-bit parallel, continuous formatter ----
mww 0x5C015FB0 0xC5ACCE55
mww 0x5C015004 0x00000008
mww 0x5C0150F0 0x00000000
mww 0x5C015304 0x00000102
mww 0x5C015204 0            ;# ensure CURTPM test pattern OFF

# ---- CSTF funnel: enable ETM slave port S0 ----
mww 0x5C013FB0 0xC5ACCE55
mww 0x5C013000 [expr {[mrw 0x5C013000] | 0x00000001}]

# ---- ETF: hardware FIFO mode, capture enable ----
mww 0x5C014020 0x00000000
mww 0x5C014FB0 0xC5ACCE55
mww 0x5C014028 0x00000002
mww 0x5C014304 0x00000001
mww 0x5C014020 0x00000001

# ---- ETM (ETMv4) program ----
mww 0xE0041FB0 0xC5ACCE55
mww 0xE0041310 0x00000008   ;# TRCPDCR.PU power-up
mww 0xE0041004 0x00000000   ;# disable to program
set idle 0
for {set i 0} {$i < 100} {incr i} {
    if {[expr {[mrw 0xE004100C] & 0x1}]} { set idle 1; break }
}
if {!$idle} { echo "WARN: ETM not IDLE" }
mww 0xE0041010 0x00000000   ;# TRCCONFIGR: BB=0, no ts/cc/cond/retstack
mww 0xE0041040 0x00000002   ;# TRCTRACEIDR = 2
mww 0xE004102C 0x00000000   ;# TRCSTALLCTLR: NO stall (no timing perturbation)
mww 0xE0041080 0x00000201   ;# TRCVICTLR: trace-all + started
mww 0xE0041034 0x0000000C   ;# TRCSYNCPR: 2^12 byte sync period
mww 0xE0041004 0x00000001   ;# TRCPRGCTLR.EN = 1

# ---- load the self-branch stub into RAM and run it ----
# `b .` = 0xE7FE (thumb, 2 bytes). Word at 0x24000000 = 0x0000E7FE, but we only
# need the low halfword to be the branch; pad the upper halfword with another
# 0xE7FE so ANY entry lands on a self-branch.
mww 0x24000000 0xE7FEE7FE
reg pc 0x24000000
# make sure Thumb bit is set in xPSR (Cortex-M is always Thumb; set T bit)
reg xPSR 0x01000000
resume

echo "==================== READBACK ===================="
echo "TPIU_CURPSIZE = [format 0x%08x [mrw 0x5C015004]]  (expect 0x08)"
echo "TPIU_FFCR     = [format 0x%08x [mrw 0x5C015304]]  (expect 0x102)"
echo "CSTF_CTRL     = [format 0x%08x [mrw 0x5C013000]]  (expect bit0=1)"
echo "ETF_CTL       = [format 0x%08x [mrw 0x5C014020]]  (expect 0x01)"
echo "TRCPRGCTLR    = [format 0x%08x [mrw 0xE0041004]]  (expect 0x01 enabled)"
echo "TRCCONFIGR    = [format 0x%08x [mrw 0xE0041010]]  (expect 0x00 = BB off)"
echo "TRCVICTLR     = [format 0x%08x [mrw 0xE0041080]]  (expect 0x201)"
echo "TRCSTALLCTLR  = [format 0x%08x [mrw 0xE004102C]]  (expect 0x00 = no stall)"
echo "==================================================================="
echo " Self-branch loop running at 0x24000000. ETM stream should be a solid"
echo " run of 0xD4 (24-E Atom Format 6) after each A-Sync/TraceInfo/Address."
echo "==================================================================="
shutdown
