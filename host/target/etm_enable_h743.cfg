# OpenOCD: enable STM32H743 (Cortex-M7) 4-bit parallel ETM trace, FULL sequence.
#
# WHY A SEPARATE FILE FROM etm_enable.cfg (F429):
#   The H7 core is Cortex-M7 -> its ETM is a CoreSight ETM-M7 implementing the
#   **ETMv4** architecture (DDI0494D). This is a COMPLETELY different register
#   model from the F429's ETM3.5/ETM-M4 (DDI0440C): TRCPRGCTLR/TRCCONFIGR/
#   TRCVICTLR/TRCTRACEIDR instead of ETMCR/ETMTECR1/ETMTEEVR. Do NOT reuse the
#   F429 ETMCR pokes here -- they hit reserved space on ETMv4.
#
#   Also H7 puts its debug/trace subsystem on the D-domain APB-D bus with the
#   DBGMCU at 0x5C001004 (NOT the F4's 0xE0042004), and TRACECLK must be gated
#   on via DBGMCU_CR before any trace flows. The ETM component itself is still
#   reachable at the core-local 0xE0041000 (Cortex-M7 Processor ROM table entry
#   0xE00FE004 -> 0xFFF43003 -> base 0xE0041000; RM0433 §60 + DDI0489F §9.1.1).
#
# Trace pins (identical to F429, confirmed in STM32H743 datasheet AF map, AF0):
#   TRACECK=PE2  TRACED0=PE3  TRACED1=PE4  TRACED2=PE5  TRACED3=PE6
#   -> same GPIO1 header wiring to the A7-Lite as the F429 (see HANDOFF §1.2).
#
# References (all in docs/artix7-port/refs/):
#   DDI0494D_coresight_etm_m7_r0p1_trm.pdf  -- ETMv4 register model + prog seq
#   DDI0489F_cortex_m7_trm.pdf              -- M7 ROM table / ETM base / TPIU
#   RM0433 (docs/) §60 Debug infrastructure -- H7 DBGMCU/TPIU/clock addresses
#
# Probe: this H743 board uses a DAPLink (CMSIS-DAP v1/v2 dual; OpenOCD picks
# the faster v2 bulk interface) -- NOT an ST-Link. Use interface/cmsis-dap.cfg.
#
# Run:
#   openocd -f interface/cmsis-dap.cfg -f target/stm32h7x.cfg \
#           -f syn/artix7/bringup/target/etm_enable_h743.cfg
#
# VERIFIED ON HARDWARE (2026-07-05): all readbacks correct; PE2 TRACECK clock +
# all 4 data lanes TRACED0..3 (PE3..6) confirmed toggling on a logic analyser
# via the TPIU AA/55 test pattern (TPIU_CURTPM=0x00020004 forces all lanes,
# independent of ETM traffic). GPIO datapath and pin mux fully proven good.

init
reset halt

# proposal 37 r30: runtime cache flag in RAM_D1 (0x24000000). Written here,
# AFTER the reset-halt, so it survives into main() (resume at end, no further
# reset). Set CACHE_FLAG env: 0xCACE=enable cache, 0=disable. Unset=leave alone.
if {[info exists ::env(CACHE_FLAG)]} { mww 0x24000000 $::env(CACHE_FLAG) }

# ==================================================================
# 0) GPIOE: clock + PE2..PE6 -> Alternate Function 0 (trace), very high
#    speed, push-pull. On H7 the GPIO port clocks live in RCC_AHB4ENR
#    (0x580244E0); GPIOE base = 0x58021000 (RM0433 memory map).
# ==================================================================
# RCC_AHB4ENR bit4 = GPIOEEN
mww 0x580244E0 [expr {[mrw 0x580244E0] | 0x00000010}]

# MODER: PE2..PE6 -> 10 (alternate function). Each pin = 2 bits.
#   PE2 bits[5:4], PE3 [7:6], PE4 [9:8], PE5 [11:10], PE6 [13:12]
set moder [mrw 0x58021000]
set moder [expr {$moder & ~(0x3FFF << 4)}]
set moder [expr {$moder | (0x2 << 4) | (0x2 << 6) | (0x2 << 8) | (0x2 << 10) | (0x2 << 12)}]
mww 0x58021000 $moder

# OSPEEDR (+0x08): PE2..PE6 -> 11 (very high speed) -- trace edges are fast.
set ospeedr [mrw 0x58021008]
set ospeedr [expr {$ospeedr | (0x3 << 4) | (0x3 << 6) | (0x3 << 8) | (0x3 << 10) | (0x3 << 12)}]
mww 0x58021008 $ospeedr

# OTYPER (+0x04): push-pull (clear bits 2..6)
mww 0x58021004 [expr {[mrw 0x58021004] & ~(0x7C)}]

# AFRL (+0x20): PE2..PE6 alternate function = AF0 (trace). Each pin = 4 bits.
#   PE2 [11:8], PE3 [15:12], PE4 [19:16], PE5 [23:20], PE6 [27:24]; AF0 = 0.
set afrl [mrw 0x58021020]
set afrl [expr {$afrl & ~(0xFFFFF << 8)}]
mww 0x58021020 $afrl

# ==================================================================
# 1) Core trace power: DEMCR.TRCENA (bit24) -- same PPB reg on all Cortex-M.
# ==================================================================
mww 0xE000EDFC 0x01000000

# ==================================================================
# 2) DBGMCU_CR (0x5C001004): gate on the trace clocks.
#    bit20 TRACECLKEN (MUST be set before TPIU output),
#    bit21 D1DBGCKEN  (D1 domain debug components clocked),
#    bit22 D3DBGCKEN  (D3 domain debug components clocked).
#    -> 0x00700000. NOTE: unlike F4 there is NO TRACE_MODE/TRACE_IOEN field
#    here; port width is set in the TPIU (step 3), pins muxed via GPIO (step 0),
#    and TRACECLK frequency is set in RCC (pll1_r_ck / traceclk divider).
# ==================================================================
mww 0x5C001004 [expr {[mrw 0x5C001004] | 0x00700000}]

# ==================================================================
# 3) TPIU. IMPORTANT H7 DIFFERENCE: the Cortex-M7 core does NOT contain a TPIU
#    (DDI0489F §9.1.1: "TPIU not implemented inside Cortex-M7"), so the F4's
#    core-PPB address 0xE0040000 does NOT exist here. The STM32H7 SoC TPIU is a
#    separate CoreSight component on the APB-D bus:
#       debugger view : 0xE00F5000   (RM0433 System ROM table 2)
#       system bus     : 0x5C015000
#    CRITICAL: the D-domain trace components (TPIU/funnel/ETF/SWO) are NOT
#    reachable at the debugger-view 0xE00Fxxxx aliases from OpenOCD's MEM-AP
#    (AHB-AP) -- those read back 0. They MUST be accessed at their system-bus
#    addresses 0x5C0xxxxx (confirmed: DBGMCU_CR@0x5C001004 works, 0xE00Fxxxx
#    reads 0). So TPIU = 0x5C015000 (RM0433 System ROM table 2).
#    Register offsets are the standard CoreSight SoC-400 TPIU layout:
#       CURPSIZE (+0x004) = 0x08  -> current port size = 4 bits (bit n-1, n=4).
#                                    This H743 TPIU SUPPSIZE reads 0x000000FF
#                                    (port sizes 1..8 supported); we use 4.
#       SPPR     (+0x0F0) = 0x00  -> pin protocol = parallel trace port
#       FFCR     (+0x304) = 0x102 -> EnFCont + EnFTC (continuous formatting)
#    (SPPR/ACPR prescaler are only meaningful for SWO/serial mode; parallel
#     TRACECLK comes from RCC pll1_r_ck, so no ACPR here. Set port size only
#     while the formatter is stopped -- fresh after reset halt it is.)
#    NOTE (hw-confirmed): some firmware locks the TPIU via its CoreSight
#    software lock (LSR reads 0x03 = lock implemented + LOCKED). Then CURPSIZE/
#    FFCR writes are silently dropped (read back reset values). Always write
#    LAR (+0xFB0) = 0xC5ACCE55 first to unlock, same for CSTF/ETF/ETM below.
# ==================================================================
mww 0x5C015FB0 0xC5ACCE55
mww 0x5C015004 0x00000008
mww 0x5C0150F0 0x00000000
mww 0x5C015304 0x00000102

# ==================================================================
# 3b) CoreSight Trace Funnel (CSTF) -- H7-ONLY, NO EQUIVALENT ON F429.
#    On the H7 the ETM's ATB does NOT go straight to the TPIU; it passes
#    through a 2-input trace funnel (S0 = Cortex-M7 ETM, S1 = ITM). CSTF_CTRL
#    resets to 0x00000300 with BOTH slave ports DISABLED (ENS0=ENS1=0), so
#    without this step the ETM produces trace but NOTHING reaches the pins.
#    Enable S0 (ETM). CSTF must be accessed at its system-bus address
#    0x5C013000 (the 0xE00F3000 debugger alias reads 0 from the MEM-AP, same as
#    the TPIU). Unlock the CoreSight software lock first.
#      CTRL (+0x000): bit0 ENS0 = 1 (enable ETM slave port); keep MIN_HOLD_TIME.
# ==================================================================
mww 0x5C013FB0 0xC5ACCE55
mww 0x5C013000 [expr {[mrw 0x5C013000] | 0x00000001}]

# ==================================================================
# 3c) Embedded Trace FIFO (ETF) -- H7-ONLY, NO EQUIVALENT ON F429. **CRITICAL.**
#    H7 trace topology is:  ETM -> CSTF funnel -> ETF (4KB TMC FIFO) -> TPIU.
#    The ETF resets to DISABLED, which BLOCKS the ATB path -- with the ETF
#    disabled the ETM emits trace but it never reaches the TPIU, and the TPIU
#    only outputs its own HSYNC filler (looks like a live-but-dataless stream).
#    Put the ETF in HARDWARE-FIFO mode (drains through its ATB master to the
#    TPIU) and enable trace capture. ETF at system-bus 0x5C014000 (CoreSight
#    TMC register layout). Unlock LAR, program while DISABLED, then enable.
#      CTL  (+0x020): bit0 TraceCaptEn
#      MODE (+0x028): 0x0=circular buffer, 0x1=software FIFO, 0x2=hardware FIFO
#      FFCR (+0x304): bit0 ENFT (enable formatting) so drained frames are framed
#    (hw-confirmed: with ETF in circular mode the RAM fills with real ETMv4
#     data -> proves the ETM emits; HW-FIFO mode drains it to the TPIU pins.)
# ==================================================================
mww 0x5C014020 0x00000000
mww 0x5C014FB0 0xC5ACCE55
mww 0x5C014028 0x00000002
mww 0x5C014304 0x00000001
mww 0x5C014020 0x00000001

# ==================================================================
# 4) ETM (ETMv4 / CoreSight ETM-M7) at 0xE0041000.
#    Programming procedure (DDI0494D Fig 3-1):
#      a. Unlock (TRCLAR +0xFB0 = 0xC5ACCE55) then clear TRCPRGCTLR.EN
#      b. Poll TRCSTATR.IDLE (bit0) == 1
#      c. Program all trace registers
#      d. Set TRCPRGCTLR.EN
# --------------------------------------------------------------
# unlock software lock
mww 0xE0041FB0 0xC5ACCE55

# TRCPDCR.PU (+0x310, bit3) = 1: POWER-UP REQUEST. **CRITICAL AND EASY TO MISS**
# -- without this the ETM-M7 stays power-gated: TRCPDSR reads 0x03 (STICKYPD
# set), the programmers model never stabilises (TRCSTATR.PMSTABLE stuck 0) and
# no trace is produced even though every other register reads back correct.
# Setting PU keeps power to the ETM and its trace registers. Confirmed on this
# H743: after PU=1, TRCPDSR->0x01 and TRCSTATR->0x03 (IDLE|PMSTABLE) when
# disabled. (Reset to 0 on trace-unit reset, so must be re-done after reset.)
mww 0xE0041310 0x00000008

# TRCPRGCTLR (+0x004): EN = 0 (disable to program)
mww 0xE0041004 0x00000000

# wait for TRCSTATR.IDLE (bit0) = 1
set idle 0
for {set i 0} {$i < 100} {incr i} {
    if {[expr {[mrw 0xE004100C] & 0x1}]} { set idle 1; break }
}
if {!$idle} { echo "WARN: ETM did not reach IDLE (TRCSTATR.IDLE=0)" }

# TRCCONFIGR (+0x010): instruction trace config.
#   bit3 BB = branch broadcast. THIS IS THE DOMINANT TRACE-BYTE-RATE LEVER.
#   BB=1: emit an address for EVERY taken branch (incl. direct). Maximises
#         decoder anchoring but at M7 speed + I/D cache the byte rate is huge.
#   BB=0: only indirect branches/exceptions emit addresses; the decoder follows
#         direct branches by disassembling the ELF (orbetto does this). Much
#         lower byte rate.
#
#   BOARD-MEASURED (2026-07-11, H743 @ TRACECLK=12.8MHz, orbetto ETMv4, func_test):
#     BB=1 : orbetto Overflows ~2013,  ETF over-runs constantly (byte rate >>
#            the 12.8MHz*4bit*2 ~= 12.8 MB/s parallel-port drain).
#     BB=0 : orbetto Overflows   ~88  (-95%), clean call stack.
#   Disabling all interrupts (PRIMASK=1) did NOT help (overflows unchanged/worse)
#   -> the overflow root cause is BRANCH RATE, not interrupt load (proposal 29).
#
#   RULE OF THUMB: at LOW TRACECLK (parallel-port drain < M7 branch byte rate)
#   use BB=0. Only turn BB=1 when TRACECLK is high enough to drain it (or when
#   you specifically need every-branch anchoring and can tolerate the overflows).
#   Set TRACE_BB env before sourcing to override; default here is BB=0 (safe for
#   the current low TRACECLK). INSTP0=00, no cyccnt/ts/cond/retstack.
set trace_bb 0
if {[info exists ::env(TRACE_BB)]} { set trace_bb $::env(TRACE_BB) }
mww 0xE0041010 [expr {$trace_bb ? 0x00000008 : 0x00000000}]

# TRCTRACEIDR (+0x040): ATB trace ID = 2 (matches the F429 TraceID so the same
# orbetto -t 2 / demux settings apply).
mww 0xE0041040 0x00000002

# TRCSTALLCTLR (+0x02C): ROOT FIX for overflow (DDI0494D §3.4.7 — "prevents
# trace unit buffer overflows"). Instead of letting the ETF FIFO overflow and
# drop trace (which corrupts the decoder call stack across the gap), STALL the
# CPU when the instruction-trace buffer runs low, so EVERYTHING the ETM emits is
# complete and lossless. This is ARM's official lossless-trace mechanism.
#   [8]   ISTALL = 1  -> trace unit may stall the processor on low I-trace buffer
#   [3:2] LEVEL  = 11 -> maximum invasion, minimum FIFO-overflow risk
#   => 0x0000010C
# Tradeoff: the CPU is throttled during trace-heavy bursts (runs slower), but
# the trace stream is COMPLETE -- no overflow packets, no lost instructions, so
# the decoder rebuilds the FULL call stack with no segment-boundary jumps.
# Caveat (DDI0494D): with LEVEL!=0 the ETM may suppress in-stream global
# timestamps / cycle-count; harmless here since orbetto uses the FPGA time base.
# Set TRACE_STALL=0 env before sourcing to disable (revert to lossy/no-stall).
set trace_stall 1
if {[info exists ::env(TRACE_STALL)]} { set trace_stall $::env(TRACE_STALL) }
mww 0xE004102C [expr {$trace_stall ? 0x0000010C : 0x00000000}]

# TRCVICTLR (+0x080): ViewInst main control -- trace ALL instructions.
#   [9] SSSTATUS = 1 (start/stop logic in STARTED state; must be set so trace
#       is active without needing a start-address match)
#   [7] TYPE = 0 (single selected resource)
#   [3:0] SEL = 1 -> resource selector 1, which in ETMv4 is the architectural
#       constant-TRUE resource. => ViewInst event is always TRUE = trace all.
#   Exception-level filters [19],[16],[11],[10] = 0 (trace all levels + reset).
#   -> 0x00000201.
mww 0xE0041080 0x00000201

# TRCSYNCPR (+0x034): synchronization period. Leave at the reset/impl value so
# periodic trace-sync packets keep the decoder re-anchoring; explicit poke
# 0x0000000C = 2^12 bytes if a value is required (RWc; may be fixed on M7).
mww 0xE0041034 0x0000000C

# START tracing: TRCPRGCTLR.EN = 1
mww 0xE0041004 0x00000001

echo "==================== READBACK ===================="
echo "CSTF_CTRL     = [format 0x%08x [mrw 0x5C013000]]  (expect bit0 ENS0=1, e.g. 0x0301)"
echo "GPIOE_MODER   = [format 0x%08x [mrw 0x58021000]]  (PE2..6 = 10b each)"
echo "GPIOE_OSPEEDR = [format 0x%08x [mrw 0x58021008]]  (PE2..6 = 11b each)"
echo "GPIOE_AFRL    = [format 0x%08x [mrw 0x58021020]]  (PE2..6 nibbles = 0 = AF0)"
echo "DBGMCU_CR     = [format 0x%08x [mrw 0x5C001004]]  (expect bits 20/21/22 set = 0x0070xxxx)"
echo "ETF_MODE      = [format 0x%08x [mrw 0x5C014028]]  (expect 0x02 = hardware FIFO)"
echo "ETF_CTL       = [format 0x%08x [mrw 0x5C014020]]  (expect 0x01 = TraceCaptEn)"
echo "TPIU_CURPSIZE = [format 0x%08x [mrw 0x5C015004]]  (expect 0x08 = 4-bit)"
echo "TPIU_SPPR     = [format 0x%08x [mrw 0x5C0150F0]]  (expect 0x00 = parallel)"
echo "TPIU_FFCR     = [format 0x%08x [mrw 0x5C015304]]  (expect 0x102)"
echo "TRCPDSR       = [format 0x%08x [mrw 0xE0041314]]  (expect 0x01 = POWER on, STICKYPD clear)"
echo "TRCPRGCTLR    = [format 0x%08x [mrw 0xE0041004]]  (expect 0x01 = ETM enabled)"
echo "TRCSTATR      = [format 0x%08x [mrw 0xE004100C]]  (EN=1 tracing -> IDLE=0; when disabled 0x03)"
echo "TRCCONFIGR    = [format 0x%08x [mrw 0xE0041010]]  (0x08=BB on, 0x00=BB off; default BB off for low TRACECLK)"
echo "TRCVICTLR     = [format 0x%08x [mrw 0xE0041080]]  (expect 0x201 = trace-all + started)"
echo "TRCTRACEIDR   = [format 0x%08x [mrw 0xE0041040]]  (expect 0x02)"
echo "TRCSTALLCTLR  = [format 0x%08x [mrw 0xE004102C]]  (0x10C = ISTALL+LEVEL max = lossless; 0x00 = no stall)"

resume

echo "==================================================================="
echo " H743 ETMv4 4-bit trace enabled. TRACECK on PE2, TRACED0..3 on PE3..6."
echo " TRACECLK freq = pll1_r_ck / trace divider (set in RCC by firmware)."
echo " Target RUNNING. Probe TRACECK/TRACED on the GPIO1 header."
echo "==================================================================="
