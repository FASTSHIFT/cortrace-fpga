# OpenOCD: enable TPIU CURTPM WITHOUT resetting or halting the CPU.
# Requires that the firmware has already run SystemClock_Config (PLL1 up).
#
# Use case: after the H743 CubeMX firmware is running (PLL1 driving sys_ck
# and pll1_r_ck for TRACECLK), we want to hijack the TPIU output path to
# emit a known CURTPM pattern (AA/55) so the on-board pin LA can measure
# the physical datapath at the RUNNING TRACECLK frequency -- which is what
# real ETM traffic will experience, not the reset-state 64 MHz HSI derivative.
#
# Set CURTPM value via env CURTPM_VAL (default 0x00020004 = AA/55 continuous).

init

# Enable GPIOE clock so AF mux writes stick
mww 0x580244E0 [expr {[mrw 0x580244E0] | 0x00000010}]

# PE2..PE6 -> AF (10 each), OSPEEDR very-high (11), OTYPER push-pull, AFRL AF0
set m [mrw 0x58021000]
set m [expr {$m & ~(0x3FFF << 4)}]
set m [expr {$m | (0x2 << 4) | (0x2 << 6) | (0x2 << 8) | (0x2 << 10) | (0x2 << 12)}]
mww 0x58021000 $m

set s [mrw 0x58021008]
set s [expr {$s & ~(0x3FF << 4)}]
set s [expr {$s | (0x3 << 4) | (0x3 << 6) | (0x3 << 8) | (0x3 << 10) | (0x3 << 12)}]
mww 0x58021008 $s

mww 0x58021004 [expr {[mrw 0x58021004] & ~(0x7C)}]

set afrl [mrw 0x58021020]
set afrl [expr {$afrl & ~(0xFFFFF << 8)}]
mww 0x58021020 $afrl

# DEMCR.TRCENA (required for TPIU access)
mww 0xE000EDFC 0x01000000

# DBGMCU trace clocks on (bit20 TRACECLKEN + bit21 D1DBGCKEN + bit22 D3DBGCKEN)
mww 0x5C001004 [expr {[mrw 0x5C001004] | 0x00700000}]

# Program TPIU: 4-bit port, parallel protocol, formatter enabled.
mww 0x5C015FB0 0xC5ACCE55                  ;# unlock CoreSight
mww 0x5C015004 0x00000008                  ;# CURPSIZE = 4-bit
mww 0x5C0150F0 0x00000000                  ;# SPPR = parallel
mww 0x5C015304 0x00000102                  ;# FFCR = EnFCont + EnFTC

# Set the test pattern -- default AA/55 continuous
set curtpm 0x00020004
if {[info exists ::env(CURTPM_VAL)]} { set curtpm $::env(CURTPM_VAL) }
mww 0x5C015204 $curtpm

echo "==================== READBACK ===================="
echo "GPIOE_MODER   = [format 0x%08x [mrw 0x58021000]]"
echo "GPIOE_OSPEEDR = [format 0x%08x [mrw 0x58021008]]"
echo "GPIOE_AFRL    = [format 0x%08x [mrw 0x58021020]]"
echo "DBGMCU_CR     = [format 0x%08x [mrw 0x5C001004]]"
echo "TPIU_CURPSIZE = [format 0x%08x [mrw 0x5C015004]]"
echo "TPIU_CURTPM   = [format 0x%08x [mrw 0x5C015204]]  (0x00020004=AA/55)"
echo "RCC_CR        = [format 0x%08x [mrw 0x58024400]]  (PLL1ON+PLL1RDY = 0x03000000)"
echo "RCC_CFGR      = [format 0x%08x [mrw 0x58024410]]  (SWS=011 = PLL1 on sys_ck)"
echo "RCC_PLL1DIVR  = [format 0x%08x [mrw 0x58024430]]  (DIVR1 in bits 30..24)"

shutdown
