# Experiment: same ETM enable as etm_enable.cfg, but ADD the ETMv3
# Synchronization Frequency Register (ETMSYNCFR @ ETMBASE+0x1E0 = 0xE00411E0)
# so the macrocell emits an A-sync periodically. Sparse A-sync (3 in 36 KB)
# is what stops orbmortem/etmdecode from locking; forcing frequent sync is
# the highest-value fix. Also poll ETMSR bit1 -> 0 after clearing the prog
# bit (r12 suspicion 2: prog bit "clear == latched" was never confirmed).
#
#   openocd -f interface/stlink.cfg -f target/stm32f4x.cfg -f etm_syncfreq.cfg

init
reset halt

# GPIOE PE2..6 -> AF0, very-high-speed (same as etm_enable.cfg)
mww 0x40023830 [expr {[mrw 0x40023830] | 0x00000010}]
set moder [mrw 0x40021000]
set moder [expr {$moder & ~(0x3FFF << 4)}]
set moder [expr {$moder | (0x2 << 4) | (0x2 << 6) | (0x2 << 8) | (0x2 << 10) | (0x2 << 12)}]
mww 0x40021000 $moder
set ospeedr [mrw 0x40021008]
set ospeedr [expr {$ospeedr | (0x3 << 4) | (0x3 << 6) | (0x3 << 8) | (0x3 << 10) | (0x3 << 12)}]
mww 0x40021008 $ospeedr
mww 0x40021004 [expr {[mrw 0x40021004] & ~(0x7C)}]
set afrl [mrw 0x40021020]
set afrl [expr {$afrl & ~(0xFFFFF << 8)}]
mww 0x40021020 $afrl

# DEMCR.TRCENA
mww 0xE000EDFC 0x01000000
# DBGMCU_CR: TRACE_IOEN + 4-bit
mww 0xE0042004 0x000000E0
# TPIU: parallel, 4-bit, formatter on
mww 0xE0040004 0x00000008
mww 0xE00400F0 0x00000000
mww 0xE0040010 0x0000000F
mww 0xE0040304 0x00000102

# ---- ETM ----
mww 0xE0041FB0 0xC5ACCE55
mww 0xE0041000 0x00000400
mww 0xE0041000 0x00000D80
mww 0xE0041200 0x00000002
mww 0xE0041024 0x00000000
mww 0xE004102C 0x00000018
mww 0xE0041020 0x0000006F

# *** NEW: Synchronization Frequency Register. Emit an A-sync every N bytes.
# Small value -> dense sync -> decoder can lock. Try 256.
mww 0xE00411E0 0x00000100

# START: clear prog bit (0x400) last -> 0x980
mww 0xE0041000 0x00000980

# r12 suspicion 2: confirm the prog bit actually latched (ETMSR bit1 -> 0).
set tries 0
while {$tries < 50} {
    set sr [mrw 0xE0041010]
    if {($sr & 0x2) == 0} { break }
    set tries [expr {$tries + 1}]
}

echo "==================== READBACK ===================="
echo "ETMCR     = [format 0x%08x [mrw 0xE0041000]]  (expect 0x980)"
echo "ETMSR     = [format 0x%08x [mrw 0xE0041010]]  (bit1=0 prog latched, bit2=1 trace active)"
echo "ETMTEEVR  = [format 0x%08x [mrw 0xE0041020]]  (expect 0x6f)"
echo "ETMSYNCFR = [format 0x%08x [mrw 0xE00411E0]]  (expect 0x100 if implemented; 0 = RAZ/WI not present)"
echo "ETMSR poll tries = $tries"

resume
echo "==> ETM running with forced sync frequency. Probe / capture now."
