# Lower STM32 HCLK (and thus the parallel TRACECLK / trace data rate) WITHOUT
# resetting — a reset would let the firmware's SystemClock_Config restore
# HPRE=/1. Run this AFTER etm_enable.sh has booted the program with ETM on.
#
# F429 parallel trace port: TRACECLK is derived from HCLK (no separate
# divider; TPIU_ACPR is SWO-async only). So the only way to slow parallel
# trace is to slow HCLK via RCC_CFGR.HPRE.
#
# HPRE (RCC_CFGR bits 7:4): 0xxx=/1, 1000=/2, 1001=/4, 1010=/8, 1011=/16,
#                           1100=/64, 1101=/128, 1110=/256, 1111=/512.
# DIV env selects the divisor; default /8. For logic-analyzer capture at
# 50 MSa/s use DIV=64 (HCLK ~2.6 MHz, ~9 samples per DDR half-bit).
#
#   DIV=64 openocd -f interface/stlink.cfg -f target/stm32f4x.cfg -f downclock.cfg
#
# NOTE: lowering the clock is safe wrt flash wait states (extra WS only hurts
# when speeding up). The program keeps running, just slower.

init
halt

# read current
set cfgr [mrw 0x40023808]
echo "RCC_CFGR before = [format 0x%08x $cfgr]"

# pick HPRE field from $::env(DIV) (default /8 = 0b1010)
set div 8
catch { set div $::env(DIV) }
set hpre 0xA
if {$div == 1}   { set hpre 0x0 }
if {$div == 2}   { set hpre 0x8 }
if {$div == 4}   { set hpre 0x9 }
if {$div == 8}   { set hpre 0xA }
if {$div == 16}  { set hpre 0xB }
if {$div == 64}  { set hpre 0xC }
if {$div == 128} { set hpre 0xD }
if {$div == 256} { set hpre 0xE }
if {$div == 512} { set hpre 0xF }

# clear HPRE [7:4] then set
set newcfgr [expr {($cfgr & ~(0xF << 4)) | ($hpre << 4)}]
mww 0x40023808 $newcfgr
echo "RCC_CFGR after  = [format 0x%08x [mrw 0x40023808]]  (HCLK now /$div)"

resume
echo "==> HCLK lowered to /$div. TRACECLK/data rate scaled down accordingly. Re-arm FPGA + capture."
