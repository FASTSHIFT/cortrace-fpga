# OpenOCD: enable STM32F429 2-bit PARALLEL ETM trace (proposal 21).
# Adapted from the verified 4-bit etm_enable.cfg. Differences:
#   - TPIU_CSPSR = 0x2          (current parallel port size = 2 bits)
#   - DBGMCU_CR TRACE_MODE = 01 (2-bit) -> 0x60 (IOEN bit5 + bits[7:6]=01)
#   - only PE2(TRACECLK)/PE3(TRACED0)/PE4(TRACED1) muxed to AF0 (PE5/6 left alone)
#   - ETM br_out=1 (call stack only; indirect-branch addr + P-header rebuild BL)
#   - stall ON first (verify the 2-bit link); turn off later to test un-throttled
#
# F429 parallel trace pins (AF0):
#   TRACECLK=PE2  TRACED0=PE3  TRACED1=PE4   (PE5/PE6 = TRACED2/3, unused in 2-bit)
#
# NOTE: parallel TRACECLK derives from HCLK (no separate divider). To get an
# SI-friendly TRACECLK, downclock HCLK with target/downclock.cfg AFTER this.
#
# Run:
#   openocd -f interface/stlink.cfg -f target/stm32f4x.cfg -f target/etm_2bit.cfg

init
reset halt

# ==================================================================
# 0) GPIOE clock + PE2/PE3/PE4 -> AF0 (trace), very-high-speed, push-pull.
#    GPIOE base 0x40021000.  (2-bit uses only these three pins.)
# ==================================================================
mww 0x40023830 [expr {[mrw 0x40023830] | 0x00000010}]

# MODER: PE2,PE3,PE4 -> 10 (alternate function). bits PE2[5:4] PE3[7:6] PE4[9:8]
set moder [mrw 0x40021000]
set moder [expr {$moder & ~(0x3F << 4)}]
set moder [expr {$moder | (0x2 << 4) | (0x2 << 6) | (0x2 << 8)}]
mww 0x40021000 $moder

# OSPEEDR: PE2,PE3,PE4 -> 11 (very high speed)
set ospeedr [mrw 0x40021008]
set ospeedr [expr {$ospeedr | (0x3 << 4) | (0x3 << 6) | (0x3 << 8)}]
mww 0x40021008 $ospeedr

# OTYPER: push-pull (clear bits 2,3,4)
mww 0x40021004 [expr {[mrw 0x40021004] & ~(0x1C)}]

# AFRL: PE2[11:8] PE3[15:12] PE4[19:16] -> AF0 (clear those nibbles)
set afrl [mrw 0x40021020]
set afrl [expr {$afrl & ~(0xFFF << 8)}]
mww 0x40021020 $afrl

# ==================================================================
# 1) Core trace power: DEMCR.TRCENA (bit24)
# ==================================================================
mww 0xE000EDFC 0x01000000

# 2) DBGMCU_CR: TRACE_IOEN(bit5) + TRACE_MODE=10 (2-bit sync) = 0xA0
#    (TRACE_MODE bits[7:6]: 00=async SWO, 01=sync 1-pin, 10=sync 2-pin,
#     11=sync 4-pin. 4-bit uses 0xE0; 2-bit is 0xA0, NOT 0x60 which is 1-pin.)
mww 0xE0042004 0x000000A0

# 3) TPIU: 2-bit parallel.
#    TPIU_CSPSR (0xE0040004) = 0x2  (current parallel port size = 2 bits)
#    TPIU_SPPR  (0xE00400F0) = 0    (parallel trace port mode)
#    TPIU_ACPR  (0xE0040010) = 0    (SWO-only; irrelevant for parallel)
#    TPIU_FFCR  (0xE0040304) = 0x102 (formatter ON, ETM in stream 2)
mww 0xE0040004 0x00000002
mww 0xE00400F0 0x00000000
mww 0xE0040010 0x00000000
mww 0xE0040304 0x00000102

# 4) ETM (ETM3.5 / ETM-M4): br_out=1 (call stack only), stall ON.
#    ETMCR: 0xC80 = stall(bit7) + prog(bit10), br_out(bit8)=0.
#    Clear prog bit (0x400) LAST to start: 0xC80 & ~0x400 = 0x880.
#    ETMSYNCFR is read-only 0x400 (1024B) on this M4; with br_out=1 anchoring is
#    sparser -- adaptive re-lock (etm35lib tpiu_deframe_walk) handles it, as on
#    the SWO path. Dense DWT SyncTap also helps frame lock.
mww 0xE0041FB0 0xC5ACCE55
mww 0xE0041000 0x00000400
mww 0xE0041000 0x00000D80
mww 0xE0041200 0x00000002
mww 0xE0041024 0x00000000
mww 0xE004102C 0x00000018
mww 0xE0041020 0x0000006F
mww 0xE0041000 0x00000980

# DWT: dense sync tap so the host can frame-lock (sparse br_out=1 stream).
mww 0xE0001FB0 0xC5ACCE55
mww 0xE0001000 0x40000401

echo "==================== READBACK ===================="
echo "DBGMCU_CR  = [format 0x%08x [mrw 0xE0042004]]  (expect 0xA0 = 2-bit sync)"
echo "TPIU_CSPSR = [format 0x%08x [mrw 0xE0040004]]  (expect 0x2)"
echo "TPIU_FFCR  = [format 0x%08x [mrw 0xE0040304]]  (expect 0x102)"
echo "ETMCR      = [format 0x%08x [mrw 0xE0041000]]  (expect 0x880: started, br_out=1, stall)"
echo "GPIOE_MODER= [format 0x%08x [mrw 0x40021000]]"

resume
echo "==================================================================="
echo " 2-bit parallel trace on PE2(CLK)/PE3(D0)/PE4(D1), AF0. Target RUNNING."
echo " TRACECLK = HCLK-derived; run downclock.cfg for SI-friendly rate."
echo " Ctrl-C to stop (keep resident for continuous trace)."
echo "==================================================================="

proc pre_shutdown {} {
    catch { resume }
}
