# OpenOCD: reconfigure a running H743 TPIU from 4-bit to 1-bit output on the
# fly. Assumes ETM/ETF/CSTF/GPIO already brought up by etm_enable_h743*.cfg.
#
# Sequence:
#   1) stop the ETF and TPIU capture
#   2) rewrite TPIU_CURPSIZE = 0x01 (1-bit port width = only D0/PE3 drives)
#   3) restart the ETF
# Result: only PE3 (D0) should carry TPIU data; PE4/PE5/PE6 should be idle.

init

# Halt ETF -> quiesce trace path
mww 0x5C014020 0x00000000

# Change TPIU port size (unlocks already in place)
mww 0x5C015FB0 0xC5ACCE55
mww 0x5C015004 0x00000001

# Restart ETF
mww 0x5C014020 0x00000001

echo "TPIU_CURPSIZE = [format 0x%08x [mrw 0x5C015004]]  (should be 0x01 = 1-bit)"
echo "ETF_CTL       = [format 0x%08x [mrw 0x5C014020]]  (should be 0x01)"

shutdown
