# GPIO link test: drive PE2 as a plain push-pull output and toggle it,
# to confirm the physical pin + your scope probe point are good BEFORE
# blaming the trace configuration.
#
# GPIOE base = 0x40021000
#   MODER  +0x00   PE2 bits[5:4] = 01 (output)
#   OTYPER +0x04   push-pull (0)
#   OSPEEDR+0x08   PE2 bits[5:4] = 11 (very high speed)
#   ODR    +0x14   bit2 = level
#
# Run:
#   openocd -f interface/stlink.cfg -f target/stm32f4x.cfg -f gpio_toggle.cfg

init
reset halt

# enable GPIOE clock (RCC_AHB1ENR bit4)
set ahb1enr [mrw 0x40023830]
mww 0x40023830 [expr {$ahb1enr | 0x00000010}]

# PE2 = output: clear MODER[5:4] then set to 01
set moder [mrw 0x40021000]
set moder [expr {($moder & ~(0x3 << 4)) | (0x1 << 4)}]
mww 0x40021000 $moder

# PE2 very-high-speed
set ospeedr [mrw 0x40021008]
mww 0x40021008 [expr {$ospeedr | (0x3 << 4)}]

echo "GPIOE_MODER   = [format 0x%08x [mrw 0x40021000]]  (PE2 bits5:4 should be 01)"
echo "GPIOE_OSPEEDR = [format 0x%08x [mrw 0x40021008]]"

# toggle PE2 in a loop ~ as fast as SWD round-trips allow (a few kHz square)
echo "Toggling PE2... probe it now. Ctrl-C to stop."
while {1} {
    mmw 0x40021014 0x00000004 0x00000000
    mmw 0x40021014 0x00000000 0x00000004
}
